<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom Tailwind Configuration */
        :root {
            --accent-color: #00ffff;
            --text-color: #111827; /* Dark gray for text */
            --border-color: #D1D5DB; /* Light gray for borders */
            --bg-color: #FFFFFF; /* White background */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body class="bg-white">

    <!-- Main App Container -->
    <div id="app-container" class="relative w-full max-w-md h-screen bg-white flex flex-col justify-center p-8">

        <!-- Logo and Welcome Text -->
        <div class="text-center mb-10">
            <div class="inline-block p-4 bg-gray-100 rounded-full mb-4">
                 <i class="fas fa-heart text-4xl" style="color: var(--accent-color); filter: drop-shadow(0 0 5px var(--accent-color));"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">다시 만나서 반가워요!</h1>
            <!-- MODIFIED: Subtitle changed to reflect app's concept -->
            <p class="text-gray-500 mt-2">공강시간을 함께 보낼 친구를 찾아보세요.</p>
        </div>

        <!-- Login Form -->
        <div class="w-full">
            <!-- Email Input -->
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-600 mb-1">이메일</label>
                <input type="email" id="email" placeholder="email@kbu.ac.kr" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-1" style="--tw-ring-color: var(--accent-color);">
            </div>

            <!-- Password Input -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-600 mb-1">비밀번호</label>
                <input type="password" id="password" placeholder="********" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-offset-1" style="--tw-ring-color: var(--accent-color);">
            </div>

            <!-- Login Button -->
            <button id="login-button" class="w-full py-3 rounded-lg text-black font-bold text-lg transition-all duration-300 hover:opacity-90" style="background-color: var(--accent-color); box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);">
                로그인
            </button>
        </div>

        <!-- Helper Links -->
        <!-- MODIFIED: Added "Find Email" link -->
        <div class="text-center mt-6">
            <a href="#" class="text-sm text-gray-500 hover:underline">이메일 찾기</a>
            <span class="text-gray-300 mx-2">|</span>
            <a href="#" class="text-sm text-gray-500 hover:underline">비밀번호 찾기</a>
            <span class="text-gray-300 mx-2">|</span>
            <a href="#" class="text-sm text-gray-500 hover:underline">회원가입</a>
        </div>

    </div>

    <script>
        // DOM Elements
        const loginButton = document.getElementById('login-button');

        // --- Initial setup on DOMContentLoaded ---
        document.addEventListener('DOMContentLoaded', () => {
            loginButton.addEventListener('click', () => {
                // In a real app, you would handle login logic here.
                // For this demo, we can just show an alert or a message.
                alert('로그인 버튼 클릭됨!');
            });
        });
    </script>
</body>
</html>
