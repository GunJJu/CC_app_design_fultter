<!-- 모여라 리스트 상세페이지 -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 상세</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Material Symbols CDN (if needed for future icons) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --accent-color: #00FFFF; /* Main neon color */
            --border-color: #E5E7EB;
            --bg-color: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }
        /* Custom scrollbar */
        .overflow-y-auto::-webkit-scrollbar {
            width: 4px;
        }
        .overflow-y-auto::-webkit-scrollbar-track {
            background: transparent;
        }
        .overflow-y-auto::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: transparent;
        }
    </style>
</head>
<body class="bg-white">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">

        <!-- Header -->
        <header class="flex-shrink-0 flex items-center justify-between p-4 border-b border-gray-200">
            <button class="text-gray-500 text-xl" onclick="history.back()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="text-xl font-bold text-gray-800" id="meeting-detail-header-title">모임 상세</div>
            <div class="flex items-center space-x-4">
                <!-- Share button removed -->
                <!-- Like button for the meeting -->
                <button id="meeting-detail-like-button" class="text-xl">
                    <i class="far fa-heart text-gray-500"></i>
                </button>
            </div>
        </header>
        
        <!-- Main Content Area -->
        <main class="flex-grow overflow-y-auto relative">
            <!-- Meeting Image -->
            <div class="w-full h-64 bg-gray-200 overflow-hidden relative">
                <img id="meeting-detail-image" src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963e?q=80&w=2070&auto=format&fit=crop" 
                     class="w-full h-full object-cover" 
                     alt="모임 이미지"
                     onerror="this.onerror=null;this.src='https://placehold.co/600x400/e5e7eb/6b7280?text=이미지%20없음';">
                
                <!-- Members info at bottom-right of image -->
                <div class="absolute bottom-4 right-4 bg-black/50 text-white px-3 py-1 rounded-full flex items-center text-sm">
                    <i class="fas fa-users mr-2"></i>
                    <span id="meeting-detail-members">0/0명</span>
                </div>
            </div>

            <!-- Meeting Information -->
            <div class="p-4">
                <h1 id="meeting-detail-title" class="text-2xl font-bold text-gray-800 mb-2">모임 제목</h1>
                
                <div class="flex items-center space-x-2 text-sm text-gray-600 mb-3">
                    <span id="meeting-detail-category" class="bg-gray-100 px-3 py-1 rounded-full">카테고리</span>
                    <!-- Added views count next to category -->
                    <span class="flex items-center">
                        <i class="fas fa-eye mr-1"></i>
                        <span id="meeting-detail-views">0</span>
                    </span>
                    <span class="flex items-center ml-2">
                        <i class="fas fa-heart text-red-500 mr-1"></i>
                        <span id="meeting-detail-likes">0</span>
                    </span>
                </div>

                <p id="meeting-detail-description" class="text-gray-700 leading-relaxed mb-6">
                    이곳은 모임에 대한 자세한 설명이 들어가는 공간입니다. 모임의 목적, 활동 내용, 참여 대상, 준비물 등을 상세하게 작성하여 공유합니다.
                </p>

                <h2 id="meeting-info-heading" class="text-lg font-semibold text-gray-800 mb-2">모임 정보</h2>
                <ul class="list-disc list-inside text-gray-700 mb-6">
                    <li><i class="far fa-calendar-alt mr-2"></i>날짜: 매주 화요일</li>
                    <li><i class="far fa-clock mr-2"></i>시간: 19:00 - 21:00</li>
                    <li><i class="fas fa-map-marker-alt mr-2"></i>장소: 교내 스터디룸 301호</li>
                </ul>

                <h2 class="text-lg font-semibold text-gray-800 mb-2">참여 멤버</h2>
                <div class="space-y-2" id="participants-list">
                    <!-- Dummy Participants -->
                    <div class="flex items-center space-x-3 bg-gray-50 p-2 rounded-lg">
                        <img src="https://placehold.co/40x40/cccccc/666666?text=User1" class="w-10 h-10 rounded-full object-cover" alt="멤버 프로필">
                        <span class="font-medium text-gray-800">활동적인 다람쥐</span>
                    </div>
                    <div class="flex items-center space-x-3 bg-gray-50 p-2 rounded-lg">
                        <img src="https://placehold.co/40x40/cccccc/666666?text=User2" class="w-10 h-10 rounded-full object-cover" alt="멤버 프로필">
                        <span class="font-medium text-gray-800">지혜로운 부엉이</span>
                    </div>
                </div>
            </div>
            <!-- "가입하기" button at the very bottom -->
            <div class="p-4 pt-0">
                <button id="join-meeting-button" class="w-full py-3 rounded-lg text-black font-bold text-lg transition-all duration-300 hover:opacity-90" style="background-color: var(--accent-color); box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);">
                    가입하기
                </button>
            </div>
        </main>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Dummy data for a single meeting
        const dummyMeetingData = {
            id: 'meeting-101',
            title: '발표 스터디',
            image: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963e?q=80&w=2070&auto=format&fit=crop',
            category: '스터디',
            currentMembers: 5,
            totalMembers: 8,
            likes: 78,
            views: 120, // Added views data
            isLiked: false, // Example: this meeting is not yet liked
            description: '매주 진행되는 발표 스터디입니다. 각자 관심 있는 주제를 선정하여 발표하고 피드백을 주고받으며 발표 실력을 향상시킵니다. 다양한 분야의 지식을 공유하고 싶은 분들을 환영합니다. 매주 화요일 저녁 7시, 교내 스터디룸 301호에서 만나요!',
            schedule: {
                date: '매주 화요일',
                time: '19:00 - 21:00',
                location: '교내 스터디룸 301호'
            },
            participants: [
                { name: '활동적인 다람쥐', avatar: 'https://placehold.co/40x40/cccccc/666666?text=User1' },
                { name: '지혜로운 부엉이', avatar: 'https://placehold.co/40x40/cccccc/666666?text=User2' },
                { name: '탐구하는 고양이', avatar: 'https://placehold.co/40x40/cccccc/666666?text=User3' },
                { name: '성실한 강아지', avatar: 'https://placehold.co/40x40/cccccc/666666?text=User4' },
                { name: '호기심 많은 토끼', avatar: 'https://placehold.co/40x40/cccccc/666666?text=User5' }
            ]
        };

        // Populate the detail page with dummy data
        document.getElementById('meeting-detail-header-title').textContent = dummyMeetingData.title;
        document.getElementById('meeting-detail-image').src = dummyMeetingData.image;
        document.getElementById('meeting-detail-title').textContent = dummyMeetingData.title;
        document.getElementById('meeting-detail-category').textContent = dummyMeetingData.category;
        document.getElementById('meeting-detail-likes').textContent = dummyMeetingData.likes;
        document.getElementById('meeting-detail-views').textContent = dummyMeetingData.views; // Populate views count
        document.getElementById('meeting-detail-members').textContent = `${dummyMeetingData.currentMembers}/${dummyMeetingData.totalMembers}명`;
        document.getElementById('meeting-detail-description').textContent = dummyMeetingData.description;

        // Populate meeting schedule
        // Fixed the querySelector to use a valid method
        const meetingInfoHeading = document.getElementById('meeting-info-heading');
        let meetingInfoList = null;
        if (meetingInfoHeading && meetingInfoHeading.nextElementSibling && meetingInfoHeading.nextElementSibling.tagName === 'UL') {
            meetingInfoList = meetingInfoHeading.nextElementSibling;
        }

        if (meetingInfoList) {
            meetingInfoList.innerHTML = `
                <li><i class="far fa-calendar-alt mr-2"></i>날짜: ${dummyMeetingData.schedule.date}</li>
                <li><i class="far fa-clock mr-2"></i>시간: ${dummyMeetingData.schedule.time}</li>
                <li><i class="fas fa-map-marker-alt mr-2"></i>장소: ${dummyMeetingData.schedule.location}</li>
            `;
        }

        // Populate participants list
        const participantsListContainer = document.getElementById('participants-list');
        participantsListContainer.innerHTML = ''; // Clear dummy content
        dummyMeetingData.participants.forEach(participant => {
            const participantEl = document.createElement('div');
            participantEl.className = "flex items-center space-x-3 bg-gray-50 p-2 rounded-lg";
            participantEl.innerHTML = `
                <img src="${participant.avatar}" class="w-10 h-10 rounded-full object-cover" alt="${participant.name} 프로필">
                <span class="font-medium text-gray-800">${participant.name}</span>
            `;
            participantsListContainer.appendChild(participantEl);
        });


        // Handle the like button in the header
        const meetingDetailLikeButton = document.getElementById('meeting-detail-like-button');
        const meetingDetailLikeIcon = meetingDetailLikeButton.querySelector('i');
        let currentLikes = dummyMeetingData.likes;

        // Set initial state of the like button
        if (dummyMeetingData.isLiked) {
            meetingDetailLikeIcon.classList.remove('far', 'text-gray-500');
            meetingDetailLikeIcon.classList.add('fas', 'text-red-500');
        } else {
            meetingDetailLikeIcon.classList.remove('fas', 'text-red-500');
            meetingDetailLikeIcon.classList.add('far', 'text-gray-500');
        }

        meetingDetailLikeButton.addEventListener('click', () => {
            if (meetingDetailLikeIcon.classList.contains('far')) { // Currently empty heart
                meetingDetailLikeIcon.classList.remove('far', 'text-gray-500');
                meetingDetailLikeIcon.classList.add('fas', 'text-red-500');
                currentLikes++;
                console.log(`Meeting ${dummyMeetingData.id} liked from detail page.`);
            } else { // Currently filled heart
                meetingDetailLikeIcon.classList.remove('fas', 'text-red-500');
                meetingDetailLikeIcon.classList.add('far', 'text-gray-500');
                currentLikes = Math.max(0, currentLikes - 1); // Prevent negative likes
                console.log(`Meeting ${dummyMeetingData.id} unliked from detail page.`);
            }
            document.getElementById('meeting-detail-likes').textContent = currentLikes; // Update displayed likes count
        });

        // Handle the join meeting button
        const joinMeetingButton = document.getElementById('join-meeting-button');
        joinMeetingButton.addEventListener('click', () => {
            alert('모임에 가입 요청이 전송되었습니다! (실제 앱에서는 가입 로직이 실행됩니다)');
        });
    });
</script>

</body>
</html>
