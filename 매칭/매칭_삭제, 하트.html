<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카드 스와이프 UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --accent-color: #00FFFF;
            /* 앱 포인트(헤더 CC,) */
            --nav-primary: #2E8B57;
            /* 하단바 메인 그린 */
            --nav-muted: #9CA3AF;
            /* 비활성 아이콘 회색 */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #dcdde1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            overflow: hidden;
        }

        .iphone-frame {
            position: relative;
            width: 393px;
            height: 852px;
            background: #1c1c1e;
            border-radius: 54px;
            padding: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .3), inset 0 2px 4px rgba(255, 255, 255, .1);
        }

        .iphone-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dynamic-island {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 125px;
            height: 36px;
            background: #1c1c1e;
            border-radius: 20px;
            z-index: 9999;
        }

        /* === 모달 오버레이: 중앙 정렬 + Dynamic Island 위로 === */
        #modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            display: grid;
            place-items: center;
            /* 확실한 수직/수평 중앙 */
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
            z-index: 10000;
            /* Dynamic Island(9999)보다 큼 */
        }

        #modal-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* 확인/삭제 팝업용 오버레이 */
        #dialog-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s ease;
            z-index: 10001;
            /* 모달보다 위 */
        }

        #dialog-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .card-stack {
            position: relative;
            width: 300px;
            height: 400px;
            perspective: 1000px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .1);
            cursor: grab;
            user-select: none;
            transition: transform .4s cubic-bezier(.25, .8, .25, 1), box-shadow .4s ease, opacity .4s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .id-card-photo {
            width: 120px;
            height: 155px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
            border: 4px solid #f0f0f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }

        .id-card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .id-card-body {
            text-align: center;
            margin-top: 15px;
            color: #333;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
        }

        .profile-info h2 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }

        .profile-info p {
            margin: 4px 0 12px;
            font-size: 14px;
            color: #888;
        }

        .profile-bio p {
            margin: 0 0 15px;
            font-size: 14px;
            line-height: 1.5;
            color: #555;
        }

        .profile-hashtags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .profile-hashtags span {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
            background: #eef2f7;
            color: #5c8dff;
        }

        .card-like-btn {
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .card-like-btn svg {
            width: 40px;
            height: 40px;
            transition: transform .2s ease;
        }

        .card-like-btn:hover svg {
            transform: scale(1.1);
        }

        .card-close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e5e7eb;
            color: #6b7280;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
            padding-bottom: 3px;
            z-index: 10;
        }

        .card-close-btn:hover {
            background: #d1d5db;
        }

        /* 확인/삭제 팝업 박스: 최상단 */
        .confirm-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .1);
            z-index: 10002;
            width: 280px;
        }

        .confirm-dialog h3 {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .confirm-dialog p {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .confirm-buttons {
            display: flex;
            gap: 12px;
        }

        .confirm-buttons button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: background-color .2s;
        }

        .confirm-buttons .no-btn {
            background: #e5e7eb;
            color: #4b5563;
        }

        .confirm-buttons .no-btn:hover {
            background: #d1d5db;
        }

        .confirm-buttons .yes-btn {
            color: #fff;
        }

        #confirm-yes-btn {
            background: #ef4444;
        }

        #confirm-yes-btn:hover {
            background: #e6395b;
        }

        #remove-yes-btn {
            background: #ef4444;
        }

        #remove-yes-btn:hover {
            background: #dc2626;
        }

        /* 그리드 */
        #grid-view-main {
            flex-grow: 1;
            overflow-y: auto;
            background: #fff;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .profile-grid-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .1);
        }

        .grid-item-remove-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: transparent;
            color: #fff;
            border: none;
            cursor: pointer;
            z-index: 5;
            font-size: 24px;
            line-height: 1;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            transition: transform .2s ease;
        }

        .grid-item-remove-btn:hover {
            transform: scale(1.15);
        }

        /* 좋아요 배지: 배경 없이 아이콘만 */
        .liked-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 6;
            background: transparent !important;
            width: auto !important;
            height: auto !important;
            padding: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            filter: none !important;
        }

        .liked-badge::before,
        .liked-badge::after {
            content: none !important;
            display: none !important;
        }

        .liked-badge i {
            color: #fff;
            font-size: 15px;
            text-shadow: 0 1px 1px rgba(80, 78, 78, .5);
        }

        .profile-grid-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            transition: transform .3s ease;
        }

        .profile-grid-item:hover img {
            transform: scale(1.05);
        }

        .profile-grid-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0, 0, 0, .7), transparent);
            padding: .75rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: #fff;
        }

        .profile-grid-item .overlay h3 {
            font-weight: bold;
            font-size: 1rem;
            margin: 0;
        }

        .profile-grid-item .overlay p {
            font-size: .75rem;
            margin: 0;
            opacity: .9;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="iphone-frame">
        <div class="iphone-screen">
            <div class="dynamic-island"></div>

            <!-- 헤더 -->
            <header class="flex-shrink-0 flex items-center justify-between p-4 bg-white z-10">
                <div>
                    <div class="text-3xl font-black" style="color: var(--accent-color);">CC,</div>
                    <div class="text-[10px] font-bold tracking-[0.2em] text-gray-500">CAMPUS CONNECT</div>
                </div>
                <div class="flex items-center space-x-4">
                    <button class="text-gray-500 text-xl"><i class="far fa-comment-dots"></i></button>
                    <button class="text-gray-500 text-xl"><i class="far fa-bell"></i></button>
                </div>
            </header>

            <!-- 메인 -->
            <main id="grid-view-main">
                <div class="p-4">
                    <h1 class="text-2xl font-bold text-gray-800">새로운 인연이 도착했어요</h1>
                    <p class="text-sm text-gray-500">누가 나에게 호감을 보냈을까요?</p>
                </div>
                <div id="profile-grid-container" class="profile-grid px-4 pb-4"></div>
            </main>

            <!-- 하단바 -->
            <footer class="relative flex-shrink-0 z-20">
                <div class="h-20 bg-white/95 border-t border-gray-100 relative">
                    <nav class="grid grid-cols-5 items-center h-full">
                        <a href="#" class="flex justify-center">
                            <i class="fa-regular fa-heart text-[26px]" style="color: var(--nav-primary);"></i>
                        </a>
                        <a href="#" class="flex justify-center">
                            <i class="fa-regular fa-eye text-2xl" style="color: var(--nav-muted);"></i>
                        </a>
                        <div class="flex justify-center">
                            <button class="flex items-center justify-center rounded-full w-16 h-16 text-white" style="
                background: var(--nav-primary);
                box-shadow: 0 10px 20px rgba(46,139,87,.28), 0 0 0 12px rgba(46,139,87,.10);
              ">
                                <i class="fa-solid fa-house text-2xl"></i>
                            </button>
                        </div>
                        <a href="#" class="flex justify-center">
                            <i class="fa-solid fa-user-group text-2xl" style="color: var(--nav-muted);"></i>
                        </a>
                        <a href="#" class="flex justify-center">
                            <i class="fa-regular fa-comment text-2xl" style="color: var(--nav-muted);"></i>
                        </a>
                    </nav>
                </div>
            </footer>

            <!-- 모달 -->
            <div id="modal-overlay">
                <main>
                    <div class="card-stack"></div>
                </main>
            </div>

            <!-- 확인 팝업용 오버레이 -->
            <div id="dialog-overlay"></div>

            <!-- 확인/삭제 팝업 -->
            <div id="confirm-dialog" class="confirm-dialog hidden">
                <h3>연락을 시작해볼까요?</h3>
                <p>상대방과의 채팅방으로 이동합니다.</p>
                <div class="confirm-buttons">
                    <button id="confirm-no-btn" class="no-btn">취소</button>
                    <button id="confirm-yes-btn" class="yes-btn">연락하러 가기</button>
                </div>
            </div>

            <div id="remove-confirm-dialog" class="confirm-dialog hidden">
                <h3>목록에서 삭제</h3>
                <p>이 프로필을 목록에서 삭제하시겠습니까?</p>
                <div class="confirm-buttons">
                    <button id="remove-no-btn" class="no-btn">취소</button>
                    <button id="remove-yes-btn" class="yes-btn">삭제</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 데이터
            const profiles = [
                { id: 1, name: "지민", major: "시각디자인과", bio: "새로운 사람들과 커피 한잔하는 걸 좋아해요. ☕️", tags: ["#비흡연", "#ENFP", "#두근두근썸"], img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=2787&auto=format&fit=crop" },
                { id: 2, name: "서준", major: "체육교육과", bio: "주말엔 주로 운동해요! 같이 운동할 분 찾아요. 💪", tags: ["#비흡연", "#ISTJ", "#두근두근썸"], img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=2787&auto=format&fit=crop" },
                { id: 3, name: "하은", major: "수의예과", bio: "귀여운 강아지랑 매일 산책하는게 행복이에요. 🐶", tags: ["#비흡연", "#INFP", "#두근두근썸"], img: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=2788&auto=format&fit=crop" },
                { id: 4, name: "도윤", major: "컴퓨터공학과", bio: "코딩과 게임을 사랑하는 개발자입니다. 💻", tags: ["#흡연", "#ENTJ", "#두근두근썸"], img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=2787&auto=format&fit=crop" },
                { id: 5, name: "시아", major: "식품영양학과", bio: "직접 만든 디저트 나눠먹는 걸 좋아해요! 🍰", tags: ["#비흡연", "#ISFP", "#두근두근썸"], img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=2787&auto=format&fit=crop" },
                { id: 6, name: "유진", major: "실용무용과", bio: "춤추는 것과 예쁜 옷 입는 걸 좋아해요! 💃", tags: ["#비흡연", "#ESFP", "#두근두근썸"], img: "https://images.unsplash.com/photo-1599577181262-29170b05e194?q=80&w=2787&auto=format&fit=crop" },
                { id: 7, name: "은우", major: "산림자원학과", bio: "자연 속에서 힐링하는 캠핑을 즐깁니다. 🏕️", tags: ["#비흡연", "#ISTP", "#두근두근썸"], img: "https://images.unsplash.com/photo-1564564321837-a57b7070ac4f?q=80&w=2874&auto=format&fit=crop" },
                { id: 8, name: "채원", major: "미술학과", bio: "조용히 그림 그리고 책 읽는 집순이에요. 🎨", tags: ["#비흡연", "#INFJ", "#두근두근썸"], img: "https://images.unsplash.com/photo-1618151313441-37c0121123e8?q=80&w=2787&auto=format&fit=crop" }
            ];

            // 좋아요한 id 보관
            const likedIds = new Set();

            // 요소
            const modalOverlay = document.getElementById('modal-overlay');
            const dialogOverlay = document.getElementById('dialog-overlay');
            const gridContainer = document.getElementById('profile-grid-container');
            const cardStack = document.querySelector('#modal-overlay .card-stack');

            const confirmDialog = document.getElementById('confirm-dialog');
            const confirmYesBtn = document.getElementById('confirm-yes-btn');
            const confirmNoBtn = document.getElementById('confirm-no-btn');

            const removeConfirmDialog = document.getElementById('remove-confirm-dialog');
            const removeYesBtn = document.getElementById('remove-yes-btn');
            const removeNoBtn = document.getElementById('remove-no-btn');

            let activeCardForLike = null;

            // 오버레이 유틸
            const anyDialogOpen = () =>
                !confirmDialog.classList.contains('hidden') ||
                !removeConfirmDialog.classList.contains('hidden');
            const openDialog = (el) => { el.classList.remove('hidden'); dialogOverlay.classList.add('visible'); };
            const closeDialog = (el) => { el.classList.add('hidden'); if (!anyDialogOpen()) dialogOverlay.classList.remove('visible'); };

            // DOM 생성
            function createElements() {
                gridContainer.innerHTML = ''; cardStack.innerHTML = '';
                profiles.forEach((p) => {
                    const gridItem = document.createElement('div');
                    gridItem.className = 'profile-grid-item';
                    gridItem.dataset.id = p.id;
                    gridItem.innerHTML = `
            <div class="liked-badge ${likedIds.has(String(p.id)) ? '' : 'hidden'}"><i class="fa-solid fa-heart"></i></div>
            <button class="grid-item-remove-btn">&times;</button>
            <img src="${p.img}" alt="${p.name}">
            <div class="overlay"><h3>${p.name}</h3><p>${p.major}</p></div>`;
                    gridContainer.appendChild(gridItem);

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.id = p.id;
                    card.innerHTML = `
            <button class="card-close-btn">&times;</button>
            <div class="id-card-photo"><img src="${p.img}" alt="${p.name}"></div>
            <div class="id-card-body">
              <div>
                <div class="profile-info"><h2>${p.name}</h2><p>${p.major}</p></div>
                <div class="profile-bio"><p>${p.bio}</p></div>
                <div class="profile-hashtags">${p.tags.map(t => `<span>${t}</span>`).join('')}</div>
              </div>
              <div class="card-like-btn">
                <svg class="heart-empty" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12.0001 5.50002C10.0001 2.50002 6.00006 3.00002 4.00006 6.50002C2.00006 10 6.00006 13.5 12.0001 19.5C18.0001 13.5 22.0001 10 20.0001 6.50002C18.0001 3.00002 14.0001 2.50002 12.0001 5.50002Z" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg class="heart-filled hidden" viewBox="0 0 24 24" fill="#FF4D6D" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12.0001 5.50002C10.0001 2.50002 6.00006 3.00002 4.00006 6.50002C2.00006 10 6.00006 13.5 12.0001 19.5C18.0001 13.5 22.0001 10 20.0001 6.50002C18.0001 3.00002 14.0001 2.50002 12.0001 5.50002Z"/>
                </svg>
              </div>
            </div>`;
                    cardStack.appendChild(card);
                });
            }
            createElements();

            // 카드 하트 상태 반영
            function setCardHeartUI(card) {
                const id = String(card.dataset.id);
                const liked = likedIds.has(id);
                card.querySelector('.heart-empty').classList.toggle('hidden', liked);
                card.querySelector('.heart-filled').classList.toggle('hidden', !liked);
            }

            // 모달 열기/닫기
            function showCardModal(id) {
                [...cardStack.querySelectorAll('.card')].forEach(card => {
                    if (card.dataset.id == id) {
                        card.style.display = 'flex';
                        cardStack.appendChild(card);
                        setCardHeartUI(card);
                        card.querySelector('.card-close-btn').onclick = hideCardModal;
                        card.querySelector('.card-like-btn').onclick = () => {
                            activeCardForLike = card; openDialog(confirmDialog);
                        };
                    } else { card.style.display = 'none'; }
                });
                modalOverlay.classList.add('visible');
                initializeSwipe();
            }
            function hideCardModal() {
                modalOverlay.classList.remove('visible');
                [confirmDialog, removeConfirmDialog].forEach(el => el.classList.add('hidden'));
                dialogOverlay.classList.remove('visible');
            }

            // 좋아요 확정
            function handleLikeAction() {
                if (!activeCardForLike) return;
                const id = String(activeCardForLike.dataset.id);
                likedIds.add(id);
                activeCardForLike.querySelector('.heart-empty').classList.add('hidden');
                activeCardForLike.querySelector('.heart-filled').classList.remove('hidden');
                gridContainer.querySelector(`.profile-grid-item[data-id='${id}']`)?.querySelector('.liked-badge')?.classList.remove('hidden');
                closeDialog(confirmDialog);
                hideCardModal();
            }

            // 스와이프(스냅백)
            let isDragging = false, startX = 0, deltaX = 0, activeCard = null;
            function initializeSwipe() {
                const currentCard = cardStack.querySelector(".card[style*='display: flex']");
                if (currentCard) {
                    currentCard.addEventListener('mousedown', onPointerDown);
                    currentCard.addEventListener('touchstart', onPointerDown, { passive: true });
                }
            }
            const onPointerDown = (e) => {
                if (e.currentTarget.style.display === 'none') return;
                activeCard = e.currentTarget; isDragging = true; activeCard.classList.add('dragging');
                const t = e.touches ? e.touches[0] : e; startX = t.clientX; activeCard.style.transition = 'none';
                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('touchmove', onPointerMove, { passive: false });
                document.addEventListener('mouseup', onPointerUp);
                document.addEventListener('touchend', onPointerUp);
            };
            const onPointerMove = (e) => {
                if (!isDragging || !activeCard) return;
                if (e.touches) e.preventDefault();
                const t = e.touches ? e.touches[0] : e; deltaX = t.clientX - startX;
                activeCard.style.transform = `translateX(${deltaX}px) rotate(${deltaX * 0.1}deg)`;
            };
            const onPointerUp = () => {
                if (!isDragging || !activeCard) return;
                isDragging = false;
                document.removeEventListener('mousemove', onPointerMove);
                document.removeEventListener('touchmove', onPointerMove);
                document.removeEventListener('mouseup', onPointerUp);
                document.removeEventListener('touchend', onPointerUp);
                activeCard.classList.remove('dragging'); activeCard.style.transition = ''; activeCard.style.transform = '';
                deltaX = 0; activeCard = null;
            };

            // 그리드 클릭(삭제/모달)
            gridContainer.addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.grid-item-remove-btn');
                const gridItem = e.target.closest('.profile-grid-item');

                if (removeBtn) {
                    e.stopPropagation();
                    const itemToRemove = gridItem;
                    const yes = document.getElementById('remove-yes-btn');
                    const no = document.getElementById('remove-no-btn');
                    openDialog(removeConfirmDialog);
                    const onNo = () => { closeDialog(removeConfirmDialog); cleanup(); };
                    const onYes = () => { itemToRemove.remove(); closeDialog(removeConfirmDialog); cleanup(); };
                    function cleanup() { yes.removeEventListener('click', onYes); no.removeEventListener('click', onNo); }
                    no.addEventListener('click', onNo);
                    yes.addEventListener('click', onYes);
                } else if (gridItem) {
                    showCardModal(gridItem.dataset.id);
                }
            });

            // 팝업 버튼
            confirmNoBtn.addEventListener('click', () => closeDialog(confirmDialog));
            confirmYesBtn.addEventListener('click', handleLikeAction);
        });
    </script>
</body>

</html>
