<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환경설정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;700;800&display=swap');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #F9FAFB;
        }

        .toggle-switch {
            transition: background-color .2s ease-in-out;
        }

        .toggle-circle {
            transition: transform .2s ease-in-out;
        }

        .toggle-checkbox:checked+.toggle-switch {
            background-color: #00FFFF;
        }

        .toggle-checkbox:checked+.toggle-switch .toggle-circle {
            transform: translateX(100%);
        }
    </style>
</head>

<body class="bg-gray-100">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">
        <!-- Header -->
        <header class="flex-shrink-0 p-4 border-b border-gray-200 relative">
            <div class="flex justify-between items-center h-full">
                <button class="text-gray-500">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-xl font-bold text-gray-800">
                    환경설정</h1>
                <div class="w-6"></div> <!-- Spacer for centering -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="w-full flex-grow flex flex-col overflow-y-auto p-6 space-y-8">

            <!-- 계정 섹션 -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 mb-2">계정</h2>
                <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-200">
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4">
                            <i data-lucide="user-cog" class="w-6 h-6 text-gray-500"></i>
                            <div>
                                <p class="font-semibold text-gray-800">개인정보 수정</p>
                                <p class="text-xs text-gray-500">이름, 소속, 학교/학과 등 편집</p>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4">
                            <i data-lucide="user-x" class="w-6 h-6 text-gray-500"></i>
                            <div>
                                <p class="font-semibold text-gray-800">차단한 회원 관리</p>
                            </div>
                        </div>
                        <span class="text-sm font-semibold text-gray-600 bg-gray-100 px-2 py-0.5 rounded-md">4명</span>
                    </a>
                </div>
            </div>

            <!-- 보안 섹션 -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 mb-2">보안</h2>
                <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-200">
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4">
                            <i data-lucide="shield-check" class="w-6 h-6 text-gray-500"></i>
                            <div>
                                <p class="font-semibold text-gray-800">2단계 인증</p>
                                <p class="text-xs text-gray-500">로그인 시 추가 인증 요구</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only toggle-checkbox">
                            <div class="w-11 h-6 bg-gray-200 rounded-full toggle-switch">
                                <div class="w-5 h-5 bg-white rounded-full shadow-md transform toggle-circle m-0.5">
                                </div>
                            </div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4">
                            <i data-lucide="fingerprint" class="w-6 h-6 text-gray-500"></i>
                            <div>
                                <p class="font-semibold text-gray-800">생체인증 로그인</p>
                                <p class="text-xs text-gray-500">Face/Touch ID 사용</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only toggle-checkbox">
                            <div class="w-11 h-6 bg-gray-200 rounded-full toggle-switch">
                                <div class="w-5 h-5 bg-white rounded-full shadow-md transform toggle-circle m-0.5">
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 알림 설정 섹션 -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 mb-2">알림 설정</h2>
                <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-200">
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4"><i data-lucide="bell" class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">푸시 알림</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox"
                                class="sr-only toggle-checkbox" checked>
                            <div class="w-11 h-6 bg-gray-200 rounded-full toggle-switch">
                                <div class="w-5 h-5 bg-white rounded-full shadow-md transform toggle-circle m-0.5">
                                </div>
                            </div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4"><i data-lucide="users" class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">모임 초대 알림</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox"
                                class="sr-only toggle-checkbox" checked>
                            <div class="w-11 h-6 bg-gray-200 rounded-full toggle-switch">
                                <div class="w-5 h-5 bg-white rounded-full shadow-md transform toggle-circle m-0.5">
                                </div>
                            </div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4"><i data-lucide="message-square"
                                class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">댓글/좋아요 알림</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox"
                                class="sr-only toggle-checkbox" checked>
                            <div class="w-11 h-6 bg-gray-200 rounded-full toggle-switch">
                                <div class="w-5 h-5 bg-white rounded-full shadow-md transform toggle-circle m-0.5">
                                </div>
                            </div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-4">
                        <div class="flex items-center gap-4"><i data-lucide="megaphone"
                                class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">소식/공지 알림</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox"
                                class="sr-only toggle-checkbox" checked>
                            <div class="w-11 h-6 bg-gray-200 rounded-full toggle-switch">
                                <div class="w-5 h-5 bg-white rounded-full shadow-md transform toggle-circle m-0.5">
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 표시 & 환경 섹션 -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 mb-2">표시 & 환경</h2>
                <div class="bg-white rounded-lg border border-gray-200">
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4">
                            <i data-lucide="languages" class="w-6 h-6 text-gray-500"></i>
                            <div>
                                <p class="font-semibold text-gray-800">언어</p>
                                <p class="text-xs text-gray-500">시스템 기본</p>
                            </div>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                    </a>
                </div>
            </div>

            <!-- 앱 정보 & 지원 섹션 -->
            <div>
                <h2 class="text-sm font-bold text-gray-500 mb-2">앱 정보 & 지원</h2>
                <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-200">
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4"><i data-lucide="mail" class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">문의하기</p>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4"><i data-lucide="info" class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">앱 버전</p>
                        </div>
                        <span class="text-sm text-gray-500">v1.3.2 (build 87)</span>
                    </a>
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4"><i data-lucide="log-out" class="w-6 h-6 text-gray-500"></i>
                            <p class="font-semibold text-gray-800">로그아웃</p>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                    </a>
                    <a href="#" class="flex items-center justify-between p-4 hover:bg-gray-50 transition">
                        <div class="flex items-center gap-4"><i data-lucide="trash-2" class="w-6 h-6 text-red-500"></i>
                            <p class="font-semibold text-red-500">계정 탈퇴</p>
                        </div>
                        <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                    </a>
                </div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
