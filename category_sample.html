<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모임 아이콘 추천</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for better look */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl bg-white p-6 sm:p-8 rounded-2xl shadow-lg">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">모임 카테고리 아이콘 추천</h1>
            <p class="text-slate-500 mt-2">앱에 사용하기 좋은 10가지 아이콘 예시입니다.</p>
        </div>

        <!-- Icon Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 sm:gap-6">

            <!-- 1. 스터디 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-indigo-500 transition-all duration-300">
                <!-- Icon SVG: BookOpen -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">스터디</p>
            </div>

            <!-- 2. 맛집탐방 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-red-500 transition-all duration-300">
                <!-- Icon SVG: UtensilsCrossed -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500">
                    <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"></path>
                    <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 1.8.7 2.5 0l7.3-7.3a4.2 4.2 0 0 0 0-6L15 15Z"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">맛집탐방</p>
            </div>
            
            <!-- 3. 운동/스포츠 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-green-500 transition-all duration-300">
                <!-- Icon SVG: Dumbbell -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-500">
                    <path d="M14.4 14.4 9.6 9.6"></path>
                    <path d="M18.657 11.343a2 2 0 1 1-2.829-2.828l1.414-1.414a2 2 0 1 1 2.828 2.828l-1.414 1.414Z"></path>
                    <path d="m21.5 21.5-1.4-1.4"></path><path d="M3.9 3.9 2.5 2.5"></path>
                    <path d="M6.778 17.222a2 2 0 1 1-2.828-2.828l1.414-1.414a2 2 0 1 1 2.829 2.828l-1.414 1.414Z"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">운동</p>
            </div>
            
            <!-- 4. 게임 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-purple-500 transition-all duration-300">
                <!-- Icon SVG: Gamepad2 -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-purple-500">
                    <line x1="6" x2="10" y1="12" y2="12"></line>
                    <line x1="8" x2="8" y1="10" y2="14"></line>
                    <line x1="15" x2="15.01" y1="13" y2="13"></line>
                    <line x1="18" x2="18.01" y1="11" y2="11"></line>
                    <rect width="20" height="12" x="2" y="6" rx="2"></rect>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">게임</p>
            </div>

            <!-- 5. 영화/문화생활 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-yellow-500 transition-all duration-300">
                <!-- Icon SVG: Film -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-500">
                    <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                    <path d="M7 3v18"></path>
                    <path d="M3 7.5h4"></path><path d="M3 12h18"></path>
                    <path d="M3 16.5h4"></path><path d="M17 3v18"></path>
                    <path d="M21 7.5h-4"></path><path d="M21 16.5h-4"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">문화생활</p>
            </div>
            
            <!-- 6. 음악/공연 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-sky-500 transition-all duration-300">
                <!-- Icon SVG: Music -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-sky-500">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">음악/공연</p>
            </div>
            
            <!-- 7. 카페/수다 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-orange-500 transition-all duration-300">
                 <!-- Icon SVG: Coffee -->
                 <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-orange-500">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                    <line x1="6" x2="6" y1="2" y2="4"></line>
                    <line x1="10" x2="10" y1="2" y2="4"></line>
                    <line x1="14" x2="14" y1="2" y2="4"></line>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">카페/수다</p>
            </div>
            
            <!-- 8. 여행 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-teal-500 transition-all duration-300">
                <!-- Icon SVG: Plane -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-teal-500">
                    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">여행</p>
            </div>
            
            <!-- 9. 봉사활동 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-pink-500 transition-all duration-300">
                <!-- Icon SVG: HeartHandshake -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-500">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
                    <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.82 2.94 0l.96-.96c.1-.1.24-.1.34 0l.96.96c.82.82 2.13.82 2.94 0l0 0a2.17 2.17 0 0 0 0-3.08L12 5Z"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">봉사활동</p>
            </div>
            
            <!-- 10. 전체/기타 -->
            <div class="flex flex-col items-center justify-center p-4 bg-slate-50 rounded-xl border border-slate-200 hover:shadow-md hover:border-gray-500 transition-all duration-300">
                <!-- Icon SVG: Users -->
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-gray-500">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <p class="mt-3 font-semibold text-slate-700">전체</p>
            </div>

        </div>
    </div>

</body>
</html>
