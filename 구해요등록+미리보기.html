<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구해요 등록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent-color: #3B82F6;
            /* Calmer Blue Color */
            --border-color: #E5E7EB;
            --bg-color: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }

        /* Custom scrollbar */
        .overflow-y-auto::-webkit-scrollbar {
            width: 4px;
        }

        .overflow-y-auto::-webkit-scrollbar-track {
            background: transparent;
        }

        .overflow-y-auto::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: transparent;
        }

        /* Custom focus styles */
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        /* Style for disabled button */
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<body class="bg-white">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">

        <!-- Header -->
        <header class="flex-shrink-0 flex items-center justify-between p-4 border-b border-gray-200">
            <button class="text-gray-500 text-xl" onclick="history.back()">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </button>
            <div class="text-xl font-bold text-gray-800">구해요 등록</div>
            <button id="preview-button" class="text-sm font-semibold" style="color: var(--accent-color);">미리보기</button>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow overflow-y-auto p-4 space-y-6">

            <!-- Image Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">대표 이미지</label>
                <div id="image-preview-container"
                    class="w-full h-48 bg-gray-100 rounded-lg flex items-center justify-center border-2 border-dashed border-gray-300 cursor-pointer">
                    <div id="image-placeholder" class="text-center text-gray-500">
                        <i data-lucide="camera" class="w-8 h-8"></i>
                        <p class="mt-2 text-sm">클릭하여 이미지 추가</p>
                    </div>
                </div>
                <input type="file" id="image-upload" class="hidden" accept="image/*">
            </div>

            <!-- Category Selection -->
            <div>
                <label for="category-select" class="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                <select id="category-select" class="w-full p-3 border border-gray-300 rounded-lg bg-white transition">
                    <option value="study">스터디</option>
                    <option value="team">팀원</option>
                    <option value="item">물품</option>
                    <option value="place">장소</option>
                    <option value="etc">기타</option>
                </select>
            </div>

            <!-- Title Input -->
            <div>
                <label for="post-title" class="block text-sm font-medium text-gray-700 mb-2">제목</label>
                <input type="text" id="post-title" class="w-full p-3 border border-gray-300 rounded-lg transition"
                    placeholder="게시물 제목을 입력하세요">
            </div>

            <!-- Description Textarea -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="post-description" class="block text-sm font-medium text-gray-700">내용</label>
                    <button id="add-template-button"
                        class="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">질문 템플릿 추가</button>
                </div>
                <textarea id="post-description" rows="8" class="w-full p-3 border border-gray-300 rounded-lg transition"
                    placeholder="구하는 목적, 필요한 내용, 기간 등을 상세하게 작성해주세요."></textarea>
            </div>

            <!-- Tags Input -->
            <div>
                <label for="post-tags" class="block text-sm font-medium text-gray-700 mb-2">태그</label>
                <input type="text" id="post-tags" class="w-full p-3 border border-gray-300 rounded-lg transition"
                    placeholder="#태그 입력 후 스페이스바">
            </div>

            <!-- Members & Deadline -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="post-members" class="block text-sm font-medium text-gray-700 mb-2">모집 인원</label>
                    <input type="number" id="post-members"
                        class="w-full p-3 border border-gray-300 rounded-lg transition" placeholder="예: 5">
                </div>
                <div>
                    <label for="post-deadline" class="block text-sm font-medium text-gray-700 mb-2">마감일</label>
                    <input type="date" id="post-deadline"
                        class="w-full p-3 border border-gray-300 rounded-lg transition">
                </div>
            </div>

        </main>

        <!-- Submit Button Footer -->
        <footer class="p-4 flex-shrink-0">
            <button id="submit-post-button"
                class="w-full py-3 rounded-lg text-white font-bold text-lg transition-all duration-300"
                style="background-color: var(--accent-color); box-shadow: 0 5px 20px rgba(59, 130, 246, 0.4);" disabled>
                등록하기
            </button>
        </footer>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-gray-50">
        <div class="max-w-md mx-auto h-screen bg-white flex flex-col">
            <!-- Preview Header -->
            <header class="flex-shrink-0 flex items-center justify-between p-4">
                <button id="close-preview-button" class="text-gray-500 text-xl"><i data-lucide="arrow-left"
                        class="w-6 h-6"></i></button>
                <div id="preview-header-title" class="text-lg font-bold text-gray-800 truncate px-4">미리보기</div>
                <button class="text-xl text-gray-500"><i data-lucide="heart" class="w-6 h-6"></i></button>
            </header>

            <!-- Preview Main Content -->
            <main class="flex-grow overflow-y-auto">
                <div class="relative w-full h-64 bg-gray-200">
                    <img id="preview-image" src="" class="w-full h-full object-cover" alt="미리보기 이미지">
                    <div class="absolute bottom-4 left-4 bg-black/50 text-white px-3 py-1 rounded-full text-sm">
                        <span id="preview-image-deadline">D-N</span>
                    </div>
                    <div class="absolute bottom-4 right-4 bg-black/50 text-white px-3 py-1 rounded-full text-sm">
                        <span id="preview-image-members">0명 모집</span>
                    </div>
                </div>
                <div class="p-4">
                    <h1 id="preview-title" class="text-2xl font-bold text-gray-800 mb-2"></h1>
                    <div class="flex items-center flex-wrap gap-x-4 gap-y-2 text-sm text-gray-500 mb-4">
                        <div id="preview-tags-container" class="flex items-center gap-2 flex-wrap">
                            <!-- Tags will be dynamically inserted here -->
                        </div>
                        <div class="flex items-center space-x-4">
                            <span class="flex items-center gap-1"><i data-lucide="eye" class="w-4 h-4"></i><span
                                    id="preview-views">0</span></span>
                            <span class="flex items-center gap-1"><i data-lucide="heart"
                                    class="w-4 h-4 text-red-500 fill-current"></i><span
                                    id="preview-likes">0</span></span>
                        </div>
                    </div>
                    <div id="preview-description" class="text-gray-700 leading-relaxed"></div>
                </div>
            </main>
            <!-- Preview Footer -->
            <footer class="p-4 flex-shrink-0 bg-white">
                <button class="w-full py-3 rounded-lg text-white font-bold text-lg"
                    style="background-color: var(--accent-color);">
                    지원하기
                </button>
            </footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const formInputs = [
                document.getElementById('post-title'),
                document.getElementById('post-description'),
            ];
            const submitButton = document.getElementById('submit-post-button');
            const imagePreviewContainer = document.getElementById('image-preview-container');
            const imageUploadInput = document.getElementById('image-upload');
            const tagsInput = document.getElementById('post-tags');

            const previewButton = document.getElementById('preview-button');
            const previewModal = document.getElementById('preview-modal');
            const closePreviewButton = document.getElementById('close-preview-button');
            let uploadedImageSrc = '';

            const descriptionTextarea = document.getElementById('post-description');
            const addTemplateButton = document.getElementById('add-template-button');

            const questionTemplate = `모집 대상 (예: 프론트엔드 개발자 1명)
- 

활동 내용 (예: 매주 토요일 사이드 프로젝트 진행)
- 

필요 역량 (예: React, Figma 사용 가능자)
- 

추가 정보 (예: 회비, 준비물, 지원 방법 등)
- 
`;
            const questionToIconMap = {
                "모집 대상": "users",
                "활동 내용": "clipboard-list",
                "필요 역량": "laptop-2",
                "추가 정보": "info"
            };

            addTemplateButton.addEventListener('click', () => {
                const currentText = descriptionTextarea.value;
                descriptionTextarea.value = currentText ? `${currentText}\n\n${questionTemplate}` : questionTemplate;
                descriptionTextarea.focus();
                validateForm();
            });

            function validateForm() {
                const allFilled = formInputs.every(input => input.value.trim() !== '');
                submitButton.disabled = !allFilled;
            }

            formInputs.forEach(input => {
                input.addEventListener('input', validateForm);
            });

            imagePreviewContainer.addEventListener('click', () => {
                imageUploadInput.click();
            });

            imageUploadInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        uploadedImageSrc = e.target.result;
                        imagePreviewContainer.innerHTML = `<img src="${uploadedImageSrc}" class="w-full h-full object-cover rounded-lg">`;
                    };
                    reader.readAsDataURL(file);
                }
            });

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('post-deadline').setAttribute('min', today);

            function formatDescription(text) {
                let isTemplateUsed = Object.keys(questionToIconMap).some(q => text.includes(q));
                if (!isTemplateUsed) {
                    return `<p class="whitespace-pre-wrap">${text}</p>`;
                }

                let html = '<div class="space-y-6">';
                const lines = text.split('\n');
                let currentQuestion = null;
                let currentAnswer = '';

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    const questionKey = Object.keys(questionToIconMap).find(q => trimmedLine.startsWith(q));

                    if (questionKey) {
                        if (currentQuestion) {
                            html += renderSection(currentQuestion, currentAnswer);
                        }
                        currentQuestion = questionKey;
                        currentAnswer = '';
                    } else if (trimmedLine.startsWith('- ')) {
                        currentAnswer += trimmedLine.substring(2) + '\n';
                    } else if (currentQuestion) {
                        currentAnswer += trimmedLine + '\n';
                    }
                });

                if (currentQuestion) {
                    html += renderSection(currentQuestion, currentAnswer);
                }

                html += '</div>';
                return html;
            }

            function renderSection(question, answer) {
                const iconName = questionToIconMap[question.split('(')[0].trim()];
                const iconHtml = `<i data-lucide="${iconName}" class="w-6 h-6 text-gray-500"></i>`;
                if (answer.trim()) {
                    return `
                        <div class="flex items-start gap-4">
                            <div class="flex-shrink-0 mt-0.5">${iconHtml}</div>
                            <div class="flex-grow">
                                <p class="font-semibold text-gray-800">${question.split('(')[0].trim()}</p>
                                <p class="mt-1 text-sm text-gray-600">${answer.trim().replace(/\n/g, '<br>')}</p>
                            </div>
                        </div>
                    `;
                }
                return '';
            }

            tagsInput.addEventListener('focus', (e) => {
                if (e.target.value.trim() === '') {
                    e.target.value = '#';
                }
            });

            tagsInput.addEventListener('input', (e) => {
                const input = e.target;
                let value = input.value;
                if (value.endsWith(' ') && value.trim().length > 1) {
                    value = value.trim() + ' #';
                }
                if (value.length > 0 && !value.startsWith('#')) {
                    value = '#' + value;
                }
                input.value = value;
            });

            previewButton.addEventListener('click', () => {
                const title = document.getElementById('post-title').value || '제목이 여기에 표시됩니다.';
                const members = document.getElementById('post-members').value || '0';
                const deadlineValue = document.getElementById('post-deadline').value;

                document.getElementById('preview-header-title').textContent = title;
                document.getElementById('preview-image').src = uploadedImageSrc || 'https://placehold.co/600x400/e5e7eb/6b7280?text=이미지%20없음';
                document.getElementById('preview-image-members').textContent = `${members}명 모집`;
                if (deadlineValue) {
                    const today = new Date();
                    today.setHours(0, 0, 0, 0);
                    const postDeadlineDate = new Date(deadlineValue);
                    postDeadlineDate.setHours(0, 0, 0, 0);
                    const diffTime = postDeadlineDate.getTime() - today.getTime();
                    let remainingDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    document.getElementById('preview-image-deadline').textContent = remainingDays >= 0 ? `D-${remainingDays}` : '마감';
                } else {
                    document.getElementById('preview-image-deadline').textContent = 'D-N';
                }

                document.getElementById('preview-title').textContent = title;
                document.getElementById('preview-description').innerHTML = formatDescription(descriptionTextarea.value);

                const tagsContainer = document.getElementById('preview-tags-container');
                tagsContainer.innerHTML = '';
                const currentTags = tagsInput.value.split('#').map(tag => tag.trim()).filter(tag => tag);
                if (currentTags.length > 0) {
                    currentTags.forEach(tag => {
                        const tagElement = document.createElement('span');
                        tagElement.className = 'text-gray-500';
                        tagElement.textContent = `#${tag}`;
                        tagsContainer.appendChild(tagElement);
                    });
                } else {
                    const tagElement = document.createElement('span');
                    tagElement.textContent = '#태그없음';
                    tagElement.className = 'text-gray-500';
                    tagsContainer.appendChild(tagElement);
                }

                document.getElementById('preview-views').textContent = '0';
                document.getElementById('preview-likes').textContent = '0';
                previewModal.classList.remove('hidden');
                lucide.createIcons(); // Re-render icons inside the modal
            });

            closePreviewButton.addEventListener('click', () => {
                previewModal.classList.add('hidden');
            });

            validateForm();
        });
    </script>

</body>

</html>
