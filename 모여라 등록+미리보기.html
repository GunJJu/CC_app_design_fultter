<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모임 만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent-color: #3B82F6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-white">
    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">

        <!-- Header -->
        <header class="flex-shrink-0 p-4 border-b border-gray-200 relative">
            <div class="flex justify-between items-center h-full">
                <button class="text-gray-500" id="back-btn">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-xl font-bold text-gray-800">
                    모임 만들기
                </h1>
                <button id="preview-button" class="text-sm font-semibold" style="color:var(--accent-color);">
                    미리보기
                </button>
            </div>
        </header>

        <!-- Main -->
        <main class="flex-grow overflow-y-auto p-6 space-y-6">

            <!-- Image Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">대표 이미지</label>
                <div id="image-preview-container"
                    class="w-full h-48 bg-gray-100 rounded-lg flex items-center justify-center border-2 border-dashed border-gray-300 cursor-pointer">
                    <div id="image-placeholder" class="text-center text-gray-500">
                        <i data-lucide="camera" class="w-8 h-8"></i>
                        <p class="mt-2 text-sm">클릭하여 이미지 추가</p>
                    </div>
                </div>
                <input type="file" id="image-upload" class="hidden" accept="image/*">
            </div>

            <!-- Title -->
            <div>
                <label for="post-title" class="block text-sm font-medium text-gray-700 mb-2">모임 이름</label>
                <input id="post-title" type="text" class="w-full p-3 border border-gray-300 rounded-lg transition"
                    placeholder="모임 이름을 입력하세요">
            </div>

            <!-- Category -->
            <div>
                <label for="category-select" class="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                <select id="category-select" class="w-full p-3 border border-gray-300 rounded-lg bg-white transition">
                    <option>스터디</option>
                    <option>운동</option>
                    <option>맛집탐방</option>
                    <option>게임</option>
                    <option>기타</option>
                </select>
            </div>

            <!-- Short desc -->
            <div>
                <label for="short-description" class="block text-sm font-medium text-gray-700 mb-2">한 줄 소개</label>
                <input id="short-description" type="text"
                    class="w-full p-3 border border-gray-300 rounded-lg transition" placeholder="모임을 한 문장으로 소개해주세요">
            </div>

            <!-- Info -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">모임 정보</label>
                <div class="space-y-2">
                    <div class="flex items-center gap-2">
                        <i data-lucide="calendar" class="w-5 h-5 text-gray-400"></i>
                        <input id="info-date" type="text"
                            class="flex-grow p-3 border border-gray-300 rounded-lg transition"
                            placeholder="날짜 (예: 매주 화요일 저녁 7시)">
                    </div>
                    <div class="flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-5 h-5 text-gray-400"></i>
                        <input id="info-location" type="text"
                            class="flex-grow p-3 border border-gray-300 rounded-lg transition"
                            placeholder="장소 (예: 교내 스터디룸, 온라인 병행)">
                    </div>
                </div>
            </div>

            <!-- Rules -->
            <div>
                <label for="rules" class="block text-sm font-medium text-gray-700 mb-2">모임 규칙</label>
                <textarea id="rules" rows="4" spellcheck="false" autocapitalize="off" autocorrect="off"
                    class="w-full p-3 border border-gray-300 rounded-lg transition"
                    placeholder="모임의 규칙을 자유롭게 작성해주세요."></textarea>
            </div>

            <!-- Activity Plan -->
            <div>
                <label for="activity-plan" class="block text-sm font-medium text-gray-700 mb-2">활동 계획</label>
                <textarea id="activity-plan" rows="6" class="w-full p-3 border border-gray-300 rounded-lg transition"
                    placeholder="모임의 구체적인 활동 계획을 작성해주세요."></textarea>
            </div>
        </main>

        <!-- Footer -->
        <footer class="p-4 flex-shrink-0 bg-white border-t">
            <button id="submit-button"
                class="w-full py-3 rounded-lg text-white font-bold text-lg transition-all duration-300"
                style="background-color:var(--accent-color);">만들기</button>
        </footer>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-gray-50">
        <div class="max-w-md mx-auto h-screen bg-white flex flex-col">
            <header class="flex-shrink-0 flex items-center justify-between p-4">
                <button id="close-preview-button"><i data-lucide="arrow-left" class="w-6 h-6"></i></button>
                <h1 id="preview-header-title" class="text-lg font-bold text-gray-800 truncate px-2"></h1>
                <div class="flex items-center gap-4">
                    <button><i data-lucide="bell" class="w-6 h-6"></i></button>
                    <button><i data-lucide="user" class="w-6 h-6"></i></button>
                </div>
            </header>

            <nav class="flex-shrink-0 flex justify-around px-4 border-b border-gray-200">
                <a class="py-3 text-sm font-bold text-gray-800 border-b-2" style="border-color:var(--accent-color);">소모임
                    소개</a>
                <a class="py-3 text-sm font-medium text-gray-500">게시판</a>
                <a class="py-3 text-sm font-medium text-gray-500">정기모임</a>
                <a class="py-3 text-sm font-medium text-gray-500">갤러리</a>
            </nav>

            <main class="flex-grow overflow-y-auto">
                <div class="relative w-full h-64 bg-gray-200">
                    <img id="preview-image" src="" class="w-full h-full object-cover" alt="미리보기 이미지">
                    <button class="absolute top-4 right-4 text-white"><i data-lucide="heart"
                            class="w-6 h-6"></i></button>
                </div>
                <div class="p-4">
                    <h2 id="preview-title" class="text-2xl font-bold text-gray-800"></h2>
                    <div class="flex items-center gap-3 text-sm text-gray-500 my-2">
                        <span id="preview-category"
                            class="bg-gray-100 text-gray-600 text-xs font-semibold px-3 py-1 rounded-md"></span>
                        <span class="flex items-center gap-1"><i data-lucide="users" class="w-4 h-4"></i>1/15</span>
                        <span class="flex items-center gap-1"><i data-lucide="eye" class="w-4 h-4"></i>0</span>
                        <span class="flex items-center gap-1"><i data-lucide="heart"
                                class="w-4 h-4 text-red-500 fill-current"></i>0</span>
                    </div>

                    <p id="preview-short-description" class="text-gray-700 leading-relaxed my-4"></p>

                    <div class="space-y-6">
                        <div>
                            <h3 class="font-bold text-lg mb-2">모임 정보</h3>
                            <div class="space-y-2 text-gray-600">
                                <p class="flex items-center gap-2"><i data-lucide="calendar"
                                        class="w-5 h-5 text-gray-400"></i><span id="preview-info-date"></span></p>
                                <p class="flex items-center gap-2"><i data-lucide="map-pin"
                                        class="w-5 h-5 text-gray-400"></i><span id="preview-info-location"></span></p>
                            </div>
                        </div>

                        <div>
                            <h3 class="font-bold text-lg mb-2">모임 규칙</h3>
                            <ul id="preview-rules" class="space-y-1 text-gray-600"></ul>
                        </div>

                        <div>
                            <h3 class="font-bold text-lg mb-2">활동 계획</h3>
                            <p id="preview-activity-plan" class="text-gray-600 whitespace-pre-wrap"></p>
                        </div>

                        <div>
                            <h3 class="font-bold text-lg mb-2">참여 멤버</h3>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <img src="https://placehold.co/40x40/3B82F6/FFFFFF?text=JP"
                                            class="w-10 h-10 rounded-full">
                                        <div>
                                            <p class="font-semibold">김지수</p>
                                            <p class="text-xs text-gray-500">모임리더</p>
                                        </div>
                                    </div>
                                    <button
                                        class="text-xs font-semibold text-green-600 bg-green-100 px-3 py-1 rounded-full">1:1
                                        문의</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </main>

            <footer class="p-4 flex-shrink-0 bg-white border-t">
                <button class="w-full py-3 rounded-lg text-white font-bold text-lg"
                    style="background-color:var(--accent-color);">
                    소모임 가입하기
                </button>
            </footer>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 아이콘 초기 렌더
            lucide.createIcons();

            const backBtn = document.getElementById('back-btn');
            backBtn.addEventListener('click', () => history.back());

            // 이미지 업로드
            const imageUploadInput = document.getElementById('image-upload');
            const imagePreviewContainer = document.getElementById('image-preview-container');
            let uploadedImageSrc = '';

            imageUploadInput.addEventListener('change', (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    uploadedImageSrc = ev.target.result;
                    imagePreviewContainer.innerHTML = `<img src="${uploadedImageSrc}" class="w-full h-full object-cover rounded-lg">`;
                };
                reader.readAsDataURL(file);
            });
            imagePreviewContainer.addEventListener('click', () => imageUploadInput.click());

            // ----- Rules: 불릿 입력(IME 대응) -----
            const ta = document.getElementById('rules');

            ta.addEventListener('focus', (e) => {
                if (e.target.value.trim() === '') e.target.value = '• ';
                e.target.selectionStart = e.target.selectionEnd = e.target.value.length;
            });

            ta.addEventListener('keydown', (e) => {
                if (e.key !== 'Enter') return;
                if (e.shiftKey) return;       // Shift+Enter = 일반 줄바꿈
                if (e.isComposing) return;    // 한글 조합 중엔 무시

                e.preventDefault();

                const { value, selectionStart: s, selectionEnd: se } = ta;

                const lineStart = value.lastIndexOf('\n', s - 1) + 1;
                const lineEnd = value.indexOf('\n', s) === -1 ? value.length : value.indexOf('\n', s);
                const curLine = value.slice(lineStart, lineEnd);

                // 내용 없는 불릿이면 리스트 종료(빈 줄)
                if (curLine.replace(/^•\s*/, '').trim() === '') {
                    const before = value.slice(0, lineStart);
                    const after = value.slice(lineEnd);
                    ta.value = before + '\n' + after;
                    const caret = before.length + 1;
                    ta.selectionStart = ta.selectionEnd = caret;
                    return;
                }

                // 새 줄에 불릿 추가 (다음에 이미 불릿 있으면 중복 방지)
                const before = value.slice(0, s);
                const after = value.slice(se);
                const nextIsBullet = after.startsWith('\n• ') || after.startsWith('• ');
                const insert = '\n' + (nextIsBullet ? '' : '• ');
                ta.value = before + insert + after;

                const caret = (before + insert).length;
                ta.selectionStart = ta.selectionEnd = caret;
            });

            // 붙여넣기/수정 시 각 줄 정규화(불릿 하나만 유지)
            ta.addEventListener('input', (e) => {
                if (e.isComposing) return;
                const caret = e.target.selectionStart;
                const lines = e.target.value.split('\n').map((ln) => {
                    if (ln.trim() === '') return '';          // 빈 줄 허용(리스트 종료)
                    return '• ' + ln.replace(/^\s*•\s*/g, '');
                });
                const newVal = lines.join('\n');
                if (newVal !== e.target.value) {
                    e.target.value = newVal;
                    e.target.selectionStart = e.target.selectionEnd = caret;
                }
            });

            // ----- Preview -----
            const previewButton = document.getElementById('preview-button');
            const previewModal = document.getElementById('preview-modal');
            const closePreviewButton = document.getElementById('close-preview-button');

            previewButton.addEventListener('click', () => {
                const title = document.getElementById('post-title').value || '모임 이름';

                document.getElementById('preview-header-title').textContent = title;
                document.getElementById('preview-title').textContent = title;
                document.getElementById('preview-image').src = uploadedImageSrc || 'https://placehold.co/600x400/e5e7eb/6b7280?text=이미지%20없음';
                document.getElementById('preview-category').textContent = document.getElementById('category-select').value;
                document.getElementById('preview-short-description').textContent = document.getElementById('short-description').value || '한 줄 소개가 여기에 표시됩니다.';
                document.getElementById('preview-info-date').textContent = document.getElementById('info-date').value || '미정';
                document.getElementById('preview-info-location').textContent = document.getElementById('info-location').value || '미정';
                document.getElementById('preview-activity-plan').textContent = document.getElementById('activity-plan').value || '활동 계획이 여기에 표시됩니다.';

                // 규칙: 줄 단위로 파싱하여 • 제거 후 다시 붙이기
                const rulesText = document.getElementById('rules').value;
                const rulesList = document.getElementById('preview-rules');
                rulesList.innerHTML = '';
                rulesText.split('\n').forEach(line => {
                    const text = line.replace(/^\s*•\s*/, '').trim();
                    if (!text) return;
                    const li = document.createElement('li');
                    li.textContent = '• ' + text;
                    rulesList.appendChild(li);
                });

                previewModal.classList.remove('hidden');

                // 동적으로 추가된 아이콘들 다시 렌더
                lucide.createIcons();
            });

            closePreviewButton.addEventListener('click', () => {
                previewModal.classList.add('hidden');
            });
        });
    </script>
</body>

</html>
