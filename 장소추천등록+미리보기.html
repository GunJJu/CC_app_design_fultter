<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소 추천하기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent-color: #3B82F6;
            /* Calmer Blue Color */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
        }

        /* Custom focus styles */
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .image-slider {
            transition: transform 0.3s ease-in-out;
        }
    </style>
</head>

<body class="bg-white">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">

        <!-- Header -->
        <header class="flex-shrink-0 p-4 border-b border-gray-200 relative">
            <div class="flex justify-between items-center h-full">
                <button class="text-gray-500" onclick="history.back()">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-xl font-bold text-gray-800">
                    장소 추천하기</h1>
                <button id="preview-button" class="text-sm font-semibold"
                    style="color: var(--accent-color);">미리보기</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow overflow-y-auto p-6 space-y-6">

            <!-- Image Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">장소 이미지 (최대 5장)</label>
                <div class="flex items-center gap-3">
                    <label for="image-upload"
                        class="w-20 h-20 bg-gray-100 rounded-lg flex flex-col items-center justify-center border-2 border-dashed border-gray-300 cursor-pointer">
                        <i data-lucide="camera" class="w-8 h-8 text-gray-400"></i>
                        <span id="image-count" class="text-sm text-gray-500 mt-1">0/5</span>
                    </label>
                    <div id="image-preview-wrapper" class="flex-1 flex gap-3 overflow-x-auto">
                        <!-- Image previews will be added here -->
                    </div>
                </div>
                <input type="file" id="image-upload" class="hidden" accept="image/*" multiple>
            </div>

            <!-- Place Search -->
            <div>
                <label for="place-name" class="block text-sm font-medium text-gray-700 mb-2">장소 이름</label>
                <div class="flex gap-2">
                    <input type="text" id="place-name"
                        class="flex-grow p-3 border border-gray-300 rounded-md transition"
                        placeholder="추천할 장소의 이름을 입력하세요">
                    <button class="p-3 bg-gray-200 rounded-md hover:bg-gray-300">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Map Area -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">위치</label>
                <div class="w-full h-40 bg-gray-200 rounded-md flex items-center justify-center">
                    <p class="text-gray-500">지도 표시 영역</p>
                </div>
            </div>

            <!-- Category Selection -->
            <div>
                <label for="category-select" class="block text-sm font-medium text-gray-700 mb-2">카테고리</label>
                <select id="category-select" class="w-full p-3 border border-gray-300 rounded-md bg-white transition">
                    <option>카페</option>
                    <option>스터디룸</option>
                    <option>도서관</option>
                    <option>공원</option>
                    <option>기타</option>
                </select>
            </div>

            <!-- Review Textarea -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="place-review" class="block text-sm font-medium text-gray-700">내용</label>
                    <button id="add-template-button"
                        class="text-xs font-semibold text-gray-500 bg-gray-100 px-2 py-1 rounded-md">질문 템플릿 추가</button>
                </div>
                <textarea id="place-review" rows="6" class="w-full p-3 border border-gray-300 rounded-md transition"
                    placeholder="장소에 대한 솔직한 리뷰를 남겨주세요. (예: 분위기, 가격, 꿀팁 등)"></textarea>
            </div>
        </main>

        <!-- Submit Button Footer -->
        <footer class="p-4 flex-shrink-0 bg-white border-t">
            <button id="submit-button"
                class="w-full py-3 rounded-lg text-white font-bold text-lg transition-all duration-300"
                style="background-color: var(--accent-color);">
                등록하기
            </button>
        </footer>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="hidden fixed inset-0 z-50 bg-gray-50">
        <div class="max-w-md mx-auto h-screen bg-white flex flex-col">
            <!-- Preview Header -->
            <header class="flex-shrink-0 flex items-center justify-between p-4">
                <button id="close-preview-button" class="text-gray-500"><i data-lucide="arrow-left"
                        class="w-6 h-6"></i></button>
                <div class="text-lg font-bold text-gray-800">장소 정보</div>
                <button class="text-red-500"><i data-lucide="heart" class="w-6 h-6 fill-current"></i></button>
            </header>

            <!-- Preview Main Content -->
            <main class="flex-grow overflow-y-auto">
                <div class="relative w-full h-64 bg-gray-200 overflow-hidden">
                    <div id="preview-image-slider" class="flex h-full image-slider">
                        <!-- Slider images will be injected here -->
                    </div>
                    <button id="prev-slide"
                        class="absolute top-1/2 left-2 -translate-y-1/2 bg-black/30 text-white rounded-full w-8 h-8 hidden items-center justify-center"><i
                            data-lucide="chevron-left" class="w-5 h-5"></i></button>
                    <button id="next-slide"
                        class="absolute top-1/2 right-2 -translate-y-1/2 bg-black/30 text-white rounded-full w-8 h-8 hidden items-center justify-center"><i
                            data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    <div id="slide-dots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-2"></div>
                </div>
                <div class="p-4">
                    <h1 id="preview-title" class="text-2xl font-bold text-gray-800"></h1>
                    <div class="flex items-center gap-3 text-sm text-gray-500 my-2 mb-6">
                        <span id="preview-category"
                            class="bg-gray-100 text-gray-600 text-xs font-semibold px-3 py-1 rounded-md"></span>
                        <span class="flex items-center gap-1"><i data-lucide="eye" class="w-4 h-4"></i><span
                                id="preview-views">0</span></span>
                        <span class="flex items-center gap-1"><i data-lucide="heart"
                                class="w-4 h-4 text-red-500 fill-current"></i><span
                                class="font-semibold">0</span></span>
                    </div>
                    <div id="preview-review" class="text-gray-700 leading-relaxed"></div>
                </div>

                <div class="px-4">
                    <h2 class="text-lg font-bold text-gray-800 mb-2">위치</h2>
                    <div class="w-full h-40 bg-gray-200 rounded-lg flex items-center justify-center">
                        <p class="text-gray-500">지도 표시 영역</p>
                    </div>
                </div>

                <div class="p-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800">리뷰</h2>
                        <button class="text-gray-400"><i data-lucide="plus" class="w-6 h-6"></i></button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons(); // Initial call to render icons

            const imageUploadInput = document.getElementById('image-upload');
            const imagePreviewWrapper = document.getElementById('image-preview-wrapper');
            const imageCountSpan = document.getElementById('image-count');
            let uploadedFiles = [];

            imageUploadInput.addEventListener('change', (event) => {
                const files = event.target.files;
                if (files.length + uploadedFiles.length > 5) {
                    alert('이미지는 최대 5장까지 업로드할 수 있습니다.');
                    return;
                }

                for (const file of files) {
                    if (uploadedFiles.length < 5) {
                        uploadedFiles.push(file);
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const previewElement = document.createElement('div');
                            previewElement.className = 'relative w-20 h-20 flex-shrink-0';
                            previewElement.innerHTML = `
                            <img src="${e.target.result}" class="w-full h-full object-cover rounded-lg">
                            <button class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs remove-image-btn">&times;</button>
                        `;
                            imagePreviewWrapper.appendChild(previewElement);
                            updateImageCount();
                        };
                        reader.readAsDataURL(file);
                    }
                }
            });

            imagePreviewWrapper.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-image-btn')) {
                    const previewElement = e.target.parentElement;
                    const index = Array.from(imagePreviewWrapper.children).indexOf(previewElement);
                    uploadedFiles.splice(index, 1);
                    previewElement.remove();
                    updateImageCount();
                }
            });

            function updateImageCount() {
                imageCountSpan.textContent = `${uploadedFiles.length}/5`;
            }

            const addTemplateButton = document.getElementById('add-template-button');
            const reviewTextarea = document.getElementById('place-review');

            const questionTemplate = `이 장소의 매력은 무엇인가요?
- 

어떤 사람에게 추천하나요?
- 

가격대는 어떤가요?
- 

나만의 꿀팁이 있다면?
- 
`;
            const questionToIconMap = {
                "이 장소의 매력은 무엇인가요?": "file-text",
                "어떤 사람에게 추천하나요?": "users",
                "가격대는 어떤가요?": "tag",
                "나만의 꿀팁이 있다면?": "star"
            };

            addTemplateButton.addEventListener('click', () => {
                const currentText = reviewTextarea.value;
                reviewTextarea.value = currentText ? `${currentText}\n\n${questionTemplate}` : questionTemplate;
                reviewTextarea.focus();
            });


            // --- Preview Logic ---
            const previewButton = document.getElementById('preview-button');
            const previewModal = document.getElementById('preview-modal');
            const closePreviewButton = document.getElementById('close-preview-button');
            const slider = document.getElementById('preview-image-slider');
            const prevBtn = document.getElementById('prev-slide');
            const nextBtn = document.getElementById('next-slide');
            const dotsContainer = document.getElementById('slide-dots');
            let currentSlide = 0;

            function formatReview(text) {
                const lines = text.split('\n');
                let html = '<div class="space-y-5">';
                let isTemplateUsed = false;

                for (const key in questionToIconMap) {
                    if (text.includes(key)) {
                        isTemplateUsed = true;
                        break;
                    }
                }

                if (!isTemplateUsed) {
                    return `<p class="whitespace-pre-wrap">${text}</p>`;
                }

                let currentQuestion = null;
                let currentAnswer = '';

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    const questionKey = Object.keys(questionToIconMap).find(q => trimmedLine.startsWith(q));

                    if (questionKey) {
                        if (currentQuestion) {
                            html += renderSection(currentQuestion, currentAnswer);
                        }
                        currentQuestion = questionKey;
                        currentAnswer = '';
                    } else if (trimmedLine.startsWith('- ')) {
                        currentAnswer += trimmedLine.substring(2) + '\n';
                    } else if (currentQuestion) {
                        currentAnswer += trimmedLine + '\n';
                    }
                });

                if (currentQuestion) {
                    html += renderSection(currentQuestion, currentAnswer);
                }


                html += '</div>';
                return html;
            }

            function renderSection(question, answer) {
                const iconName = questionToIconMap[question];
                const iconHtml = `<i data-lucide="${iconName}" class="w-5 h-5 text-gray-500"></i>`;
                if (answer.trim()) {
                    return `
                    <div>
                        <p class="font-semibold text-gray-800 flex items-center gap-2">${iconHtml} ${question}</p>
                        <p class="mt-2 text-sm text-gray-700 pl-7">${answer.trim().replace(/\n/g, '<br>')}</p>
                    </div>
                `;
                }
                return '';
            }

            previewButton.addEventListener('click', () => {
                document.getElementById('preview-title').textContent = document.getElementById('place-name').value || '장소 이름';
                document.getElementById('preview-category').textContent = document.getElementById('category-select').value;

                const reviewText = document.getElementById('place-review').value || '리뷰 내용이 여기에 표시됩니다.';
                document.getElementById('preview-review').innerHTML = formatReview(reviewText);

                slider.innerHTML = '';
                dotsContainer.innerHTML = '';
                currentSlide = 0;

                if (uploadedFiles.length > 0) {
                    uploadedFiles.forEach((file, index) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = document.createElement('img');
                            img.src = e.target.result;
                            img.className = 'w-full h-full object-cover flex-shrink-0';
                            slider.appendChild(img);
                        };
                        reader.readAsDataURL(file);

                        const dot = document.createElement('div');
                        dot.className = 'w-2 h-2 rounded-full bg-white/50 transition-colors';
                        if (index === 0) dot.classList.add('bg-white');
                        dotsContainer.appendChild(dot);
                    });

                    if (uploadedFiles.length > 1) {
                        prevBtn.style.display = 'flex';
                        nextBtn.style.display = 'flex';
                    } else {
                        prevBtn.style.display = 'none';
                        nextBtn.style.display = 'none';
                    }
                } else {
                    slider.innerHTML = `<img src="https://placehold.co/600x400/e5e7eb/6b7280?text=이미지%20없음" class="w-full h-full object-cover">`;
                    prevBtn.style.display = 'none';
                    nextBtn.style.display = 'none';
                }

                updateSlider();
                previewModal.classList.remove('hidden');
                lucide.createIcons(); // Re-render icons inside the modal
            });

            function updateSlider() {
                slider.style.transform = `translateX(-${currentSlide * 100}%)`;
                const dots = dotsContainer.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle('bg-white', i === currentSlide);
                    dots[i].classList.toggle('bg-white/50', i !== currentSlide);
                }
            }

            nextBtn.addEventListener('click', () => {
                currentSlide = (currentSlide + 1) % uploadedFiles.length;
                updateSlider();
            });

            prevBtn.addEventListener('click', () => {
                currentSlide = (currentSlide - 1 + uploadedFiles.length) % uploadedFiles.length;
                updateSlider();
            });

            closePreviewButton.addEventListener('click', () => {
                previewModal.classList.add('hidden');
            });
        });
    </script>

</body>

</html>
