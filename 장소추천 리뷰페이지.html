<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --accent-color: #3B82F6;
            /* Calmer Blue Color */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
        }

        /* Custom focus styles */
        textarea:focus,
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }

        .star-rating .star {
            color: #D1D5DB;
            /* gray-300 */
            cursor: pointer;
            transition: color 0.2s;
        }

        .star-rating .star.selected,
        .star-rating:hover .star:hover,
        .star-rating .star:hover~.star {
            color: #FBBF24;
            /* amber-400 */
        }

        .star-rating:hover .star {
            color: #FBBF24;
        }
    </style>
</head>

<body class="bg-white">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">
        <!-- Header -->
        <header class="flex-shrink-0 p-4 border-b border-gray-200 relative">
            <div class="flex justify-between items-center h-full">
                <button class="text-gray-500" onclick="history.back()">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <h1 class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-xl font-bold text-gray-800">
                    리뷰 작성</h1>
                <div class="w-6"></div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow overflow-y-auto p-6 space-y-6">

            <!-- Star Rating -->
            <div class="text-center">
                <p class="font-semibold text-gray-700 mb-3">이 장소는 어떠셨나요?</p>
                <div id="star-rating" class="star-rating flex justify-center text-4xl">
                    <i data-lucide="star" class="star"></i>
                    <i data-lucide="star" class="star"></i>
                    <i data-lucide="star" class="star"></i>
                    <i data-lucide="star" class="star"></i>
                    <i data-lucide="star" class="star"></i>
                </div>
                <input type="hidden" id="rating-value" name="rating" value="0">
            </div>

            <!-- Visit Date (수정됨) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">방문 날짜</label>
                <div class="grid grid-cols-3 gap-2">
                    <div class="relative">
                        <select id="year-select"
                            class="w-full p-3 border border-gray-300 rounded-md transition appearance-none text-center bg-white pr-8"></select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="relative">
                        <select id="month-select"
                            class="w-full p-3 border border-gray-300 rounded-md transition appearance-none text-center bg-white pr-8"></select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                    <div class="relative">
                        <select id="day-select"
                            class="w-full p-3 border border-gray-300 rounded-md transition appearance-none text-center bg-white pr-8"></select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none">
                            <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Review Textarea -->
            <div>
                <label for="place-review" class="block text-sm font-medium text-gray-700 mb-2">리뷰 내용</label>
                <textarea id="place-review" rows="8" class="w-full p-3 border border-gray-300 rounded-md transition"
                    placeholder="장소에 대한 솔직한 경험을 공유해주세요."></textarea>
            </div>
        </main>

        <!-- Submit Button Footer -->
        <footer class="p-4 flex-shrink-0 bg-white border-t">
            <button id="submit-button"
                class="w-full py-3 rounded-lg text-white font-bold text-lg transition-all duration-300"
                style="background-color: var(--accent-color);">
                등록하기
            </button>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // Star Rating Logic
            const stars = document.querySelectorAll('.star-rating .star');
            const ratingValue = document.getElementById('rating-value');

            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    ratingValue.value = index + 1;
                    updateStars(index + 1);
                });
            });

            function updateStars(rating) {
                stars.forEach((star, index) => {
                    if (index < rating) {
                        star.classList.add('selected');
                        star.style.fill = '#FBBF24';
                    } else {
                        star.classList.remove('selected');
                        star.style.fill = 'none';
                    }
                });
            }

            // Date Select Logic
            const yearSelect = document.getElementById('year-select');
            const monthSelect = document.getElementById('month-select');
            const daySelect = document.getElementById('day-select');

            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth() + 1;
            const currentDay = today.getDate();

            // Populate Years
            for (let i = currentYear; i >= 1980; i--) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${i}년`;
                yearSelect.appendChild(option);
            }

            // Populate Months
            for (let i = 1; i <= 12; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${i}월`;
                monthSelect.appendChild(option);
            }

            function populateDays(year, month) {
                const daysInMonth = new Date(year, month, 0).getDate();
                daySelect.innerHTML = ''; // Clear previous days
                for (let i = 1; i <= daysInMonth; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = `${i}일`;
                    daySelect.appendChild(option);
                }
            }

            // Set default to today
            yearSelect.value = currentYear;
            monthSelect.value = currentMonth;
            populateDays(currentYear, currentMonth);
            daySelect.value = currentDay;


            // Event Listeners
            yearSelect.addEventListener('change', () => {
                populateDays(yearSelect.value, monthSelect.value);
            });

            monthSelect.addEventListener('change', () => {
                populateDays(yearSelect.value, monthSelect.value);
            });

            lucide.createIcons();
        });
    </script>

</body>

</html>
