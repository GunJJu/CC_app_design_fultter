매칭화면 내 채팅(내가 좋아요한 사람)

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People I've Liked</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom Tailwind Configuration */
        :root {
            --primary-color: #5E81FF;
            --accent-color: #00ffff;
            --like-color: #FF4F6C;
            --bg-color: #0A0A0A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #00dddd;
        }

        /* SnackBar styling */
        .snackbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
            font-size: 14px;
        }
        .snackbar.show {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-[#0A0A0A] flex flex-col items-center justify-start min-h-screen">

    <!-- Main App Container -->
    <div id="app-container" class="relative w-full max-w-md h-screen bg-[var(--bg-color)] flex flex-col overflow-hidden">

        <!-- App Bar -->
        <header class="w-full py-4 px-4 flex items-center justify-between absolute top-0 left-0 z-20">
            <button id="back-button" class="text-white/70 text-2xl focus:outline-none">
                <i class="fas fa-arrow-left"></i>
            </button>
            <button id="menu-button" class="text-white/70 text-2xl focus:outline-none">
                <i class="fas fa-bars"></i>
            </button>
        </header>

        <!-- Menu Dropdown -->
        <div id="menu-dropdown" class="hidden absolute top-16 right-4 z-20 bg-gray-900/80 backdrop-blur-sm border border-gray-700 rounded-xl w-48 shadow-lg">
            <div class="p-2">
                <a id="menu-home" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-home w-5 text-center"></i>
                    <span>홈으로</span>
                </a>
                <a id="menu-matching" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-magnifying-glass w-5 text-center"></i>
                    <span>매칭하기</span>
                </a>
                <a id="menu-my-chats" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-comments w-5 text-center"></i>
                    <span>내 채팅</span>
                </a>
                <a id="menu-viewed-me" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-heart w-5 text-center text-like-color"></i>
                    <span>새로운 인연</span>
                </a>
                <!-- MODIFIED: Menu text changed -->
                <a id="menu-i-viewed" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-check w-5 text-center"></i>
                    <span>내가 좋아요 한 사람</span>
                </a>
            </div>
        </div>
        
        <!-- Main Content: I Liked List -->
        <main class="flex-grow pt-20 px-4 flex flex-col">
            <!-- MODIFIED: Title and description changed -->
            <h1 class="text-3xl font-bold text-white mb-2">내가 좋아요 한 사람</h1>
            <p class="text-gray-400 mb-6"> 지금까지 좋아요한 프로필들이에요.</p>
            
            <div id="user-grid" class="flex-grow overflow-y-auto custom-scroll -mx-2">
                <div class="grid grid-cols-3 gap-2 px-2">
                    <!-- User profile cards will be dynamically inserted here -->
                </div>
            </div>
        </main>

        <!-- Custom SnackBar for messages -->
        <div id="snackbar" class="snackbar"></div>

    </div>

    <script>
        // DOM Elements
        const backButton = document.getElementById('back-button');
        const menuButton = document.getElementById('menu-button');
        const menuDropdown = document.getElementById('menu-dropdown');
        const snackbar = document.getElementById('snackbar');
        const userGrid = document.querySelector('#user-grid .grid');

        // Dummy User Data for "People I've Liked"
        const iLikedUsers = [
            { name: '데이비드', age: 28, profile_image: 'https://picsum.photos/seed/david_m/400/600' },
            { name: '사라', age: 25, profile_image: 'https://picsum.photos/seed/sara_f/400/600' },
            { name: '마이클', age: 29, profile_image: 'https://picsum.photos/seed/michael_m/400/600' },
            { name: '제시카', age: 26, profile_image: 'https://picsum.photos/seed/jessica_f/400/600' },
            { name: '크리스', age: 27, profile_image: 'https://picsum.photos/seed/chris_m/400/600' },
        ];

        // --- Functions ---

        function showSnackBar(message) {
            snackbar.textContent = message;
            snackbar.classList.add('show');
            setTimeout(() => { snackbar.classList.remove('show'); }, 3000);
        }

        function renderUserGrid() {
            userGrid.innerHTML = ''; // Clear existing grid
            iLikedUsers.forEach(user => {
                const userCard = document.createElement('a');
                userCard.href = '#';
                userCard.className = 'relative aspect-[3/4] rounded-xl overflow-hidden group';
                userCard.onclick = (e) => {
                    e.preventDefault();
                    showSnackBar(`${user.name}님의 프로필을 봅니다.`);
                };

                userCard.innerHTML = `
                    <img src="${user.profile_image}" alt="${user.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                    <div class="absolute bottom-2 left-2 text-white">
                        <p class="font-bold text-sm">${user.name}, ${user.age}</p>
                    </div>
                `;
                userGrid.appendChild(userCard);
            });
        }


        // --- Initial setup on DOMContentLoaded ---
        document.addEventListener('DOMContentLoaded', () => {
            
            renderUserGrid();

            // MODIFIED: Highlight the "내가 좋아요 한 사람" menu item
            const iViewedMenuItem = document.getElementById('menu-i-viewed');
            if (iViewedMenuItem) {
                iViewedMenuItem.classList.add('bg-gray-700/70');
            }

            // Event listener for the menu button to toggle the dropdown
            menuButton.addEventListener('click', (e) => {
                e.stopPropagation();
                menuDropdown.classList.toggle('hidden');
            });

            // Event listener to close the menu when clicking outside
            document.addEventListener('click', (e) => {
                if (!menuDropdown.classList.contains('hidden') && !menuButton.contains(e.target) && !menuDropdown.contains(e.target)) {
                    menuDropdown.classList.add('hidden');
                }
            });

            // Event listener for back button
            backButton.addEventListener('click', () => {
                showSnackBar('이전 화면으로 돌아갑니다.');
            });
        });
    </script>
</body>
</html>
