<!-- 드롭다운 시안 -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드롭다운 디자인 시안</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --accent-color: #00ffff;
            --border-color: #E5E7EB;
            --bg-color: #F9FAFB;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }
        /* Common input style */
        .form-input-base {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.2s ease-in-out;
            font-size: 1rem;
            background-color: white;
        }
        .form-input-base:focus-within {
            outline: none;
            box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 4px var(--accent-color);
            border-color: var(--accent-color);
        }

        /* --- Design 1 & 2: Standard Dropdown --- */
        .custom-select-container { position: relative; }
        .custom-select-trigger {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .custom-select-options {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-top: 8px;
            z-index: 10;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        }
        .custom-select-options.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .custom-select-option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .custom-select-option:hover, .custom-select-option.selected {
            background-color: #f0fdfa;
        }
        
        /* --- Design 4: Spinning Wheel --- */
        .wheel-picker-container {
            height: 150px; /* 3 items * 50px */
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: white;
        }
        .wheel-picker-container::before, .wheel-picker-container::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 50px; /* 1 item height */
            z-index: 1;
            pointer-events: none;
        }
        .wheel-picker-container::before {
            top: 0;
            background: linear-gradient(to bottom, white, rgba(255,255,255,0));
        }
        .wheel-picker-container::after {
            bottom: 0;
            background: linear-gradient(to top, white, rgba(255,255,255,0));
        }
        .wheel-picker-indicator {
            position: absolute;
            top: 50px; /* Center position */
            left: 0;
            right: 0;
            height: 50px;
            background-color: rgba(0, 255, 255, 0.1);
            border-top: 1px solid var(--accent-color);
            border-bottom: 1px solid var(--accent-color);
            z-index: 0;
        }
        .wheel-scroll-area {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        .wheel-scroll-area::-webkit-scrollbar { display: none; }
        .wheel-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.125rem;
            color: #6b7280;
            scroll-snap-align: center;
            transition: color 0.2s, font-weight 0.2s;
        }
        
        /* --- Design 5: Tag/Bubble Picker --- */
        .tag-picker-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .tag-picker-item {
            padding: 10px 20px;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background-color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tag-picker-item.selected {
            background-color: var(--accent-color);
            color: black;
            font-weight: bold;
            border-color: var(--accent-color);
        }


    </style>
</head>
<body class="p-8">

    <div class="max-w-md mx-auto space-y-12">
        <h1 class="text-2xl font-bold text-center">드롭다운 디자인 시안</h1>

        <!-- Design 1: Visual Type -->
        <div>
            <label class="block text-lg font-bold text-gray-800 mb-2">시안 1: 비주얼 타입</label>
            <div class="custom-select-container" id="select-1">
                <div class="custom-select-trigger form-input-base">
                    <span class="flex items-center gap-3"><span class="text-2xl">🇰🇷</span><span>대한민국</span></span>
                    <i class="fas fa-chevron-down text-gray-400"></i>
                </div>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="대한민국" data-flag="🇰🇷"><span class="text-2xl mr-3">🇰🇷</span><span>대한민국</span></div>
                    <div class="custom-select-option" data-value="United States" data-flag="🇺🇸"><span class="text-2xl mr-3">🇺🇸</span><span>United States</span></div>
                    <div class="custom-select-option" data-value="Japan" data-flag="🇯🇵"><span class="text-2xl mr-3">🇯🇵</span><span>Japan</span></div>
                </div>
            </div>
        </div>

        <!-- Design 2: Minimal Type -->
        <div>
            <label class="block text-lg font-bold text-gray-800 mb-2">시안 2: 미니멀 타입</label>
            <div class="custom-select-container" id="select-2">
                <div class="custom-select-trigger form-input-base">
                    <span>선택하세요</span>
                    <i class="fas fa-chevron-down text-gray-400"></i>
                </div>
                <div class="custom-select-options">
                    <div class="custom-select-option selected" data-value="옵션 1"><span>옵션 1</span></div>
                    <div class="custom-select-option" data-value="옵션 2"><span>옵션 2</span></div>
                    <div class="custom-select-option" data-value="옵션 3"><span>옵션 3</span></div>
                </div>
            </div>
        </div>

        <!-- Design 4: Spinning Wheel Type -->
        <div>
            <label class="block text-lg font-bold text-gray-800 mb-2">시안 4: 스피닝 휠 타입</label>
            <div class="wheel-picker-container">
                <div class="wheel-picker-indicator"></div>
                <div class="wheel-scroll-area" id="wheel-picker">
                    <div style="height: 50px;"></div> <!-- Padding -->
                    <div class="wheel-item">1학년</div>
                    <div class="wheel-item">2학년</div>
                    <div class="wheel-item">3학년</div>
                    <div class="wheel-item">4학년</div>
                    <div class="wheel-item">기타</div>
                    <div style="height: 50px;"></div> <!-- Padding -->
                </div>
            </div>
        </div>

        <!-- Design 5: Tag/Bubble Type -->
        <div>
            <label class="block text-lg font-bold text-gray-800 mb-2">시안 5: 태그/버블 타입</label>
            <div class="tag-picker-container" id="tag-picker">
                <div class="tag-picker-item selected">운동</div>
                <div class="tag-picker-item">맛집탐방</div>
                <div class="tag-picker-item">영화감상</div>
                <div class="tag-picker-item">여행</div>
                <div class="tag-picker-item">코딩</div>
                <div class="tag-picker-item">음악감상</div>
            </div>
        </div>
    </div>

    <script>
        function setupDropdown(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const trigger = container.querySelector('.custom-select-trigger');
            const optionsContainer = container.querySelector('.custom-select-options');
            trigger.addEventListener('click', (e) => {
                e.stopPropagation();
                optionsContainer.classList.toggle('open');
            });
            optionsContainer.querySelectorAll('.custom-select-option').forEach(option => {
                option.addEventListener('click', () => {
                    optionsContainer.querySelector('.selected')?.classList.remove('selected');
                    option.classList.add('selected');
                    const value = option.dataset.value;
                    const flag = option.dataset.flag;
                    const triggerSpan = trigger.querySelector('span');
                    if (flag) triggerSpan.innerHTML = `<span class="text-2xl">${flag}</span><span>${value}</span>`;
                    else triggerSpan.textContent = value;
                    optionsContainer.classList.remove('open');
                });
            });
        }
        
        function setupWheelPicker() {
            const wheel = document.getElementById('wheel-picker');
            let scrollTimeout;
            wheel.addEventListener('scroll', () => {
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const scrollTop = wheel.scrollTop;
                    const itemHeight = 50;
                    const snappedScrollTop = Math.round(scrollTop / itemHeight) * itemHeight;
                    wheel.scrollTo({ top: snappedScrollTop, behavior: 'smooth' });
                }, 150);
                 updateWheelSelection(wheel);
            });
            updateWheelSelection(wheel);
        }

        function updateWheelSelection(wheel) {
             const scrollTop = wheel.scrollTop;
             const itemHeight = 50;
             const selectedIndex = Math.round(scrollTop / itemHeight);
             wheel.querySelectorAll('.wheel-item').forEach((item, index) => {
                 if(index === selectedIndex){
                     item.style.color = 'black';
                     item.style.fontWeight = 'bold';
                 } else {
                     item.style.color = '#6b7280';
                     item.style.fontWeight = 'normal';
                 }
             });
        }
        
        function setupTagPicker() {
            const container = document.getElementById('tag-picker');
            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('tag-picker-item')) {
                    container.querySelector('.selected')?.classList.remove('selected');
                    e.target.classList.add('selected');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupDropdown('select-1');
            setupDropdown('select-2');
            setupWheelPicker();
            setupTagPicker();
            document.addEventListener('click', () => {
                 document.querySelectorAll('.custom-select-options.open').forEach(el => el.classList.remove('open'));
            });
        });
    </script>
</body>
</html>
