<!-- 장소 리스트 페이지 -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Material Symbols CDN for the new icon (still needed for diversity_3) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root {
            --accent-color: #00FFFF; /* Main neon color */
            --border-color: #E5E7EB;
            --bg-color: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }
        /* Custom scrollbar for horizontal lists */
        .horizontal-scroll::-webkit-scrollbar {
            height: 0;
            background: transparent;
        }
        
        #places-list-container::-webkit-scrollbar {
            width: 4px;
        }
        #places-list-container::-webkit-scrollbar-track {
            background: transparent;
        }
        #places-list-container::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: transparent;
        }

        .filter-dropdown {
            transition: all 0.3s ease-in-out;
        }
        
        .footer-shadow {
            filter: drop-shadow(0 -4px 6px rgba(0,0,0,0.05));
        }
    </style>
</head>
<body class="bg-white">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">

        <!-- Header -->
        <header class="flex-shrink-0 flex items-center justify-between p-4">
            <div>
                <div class="text-3xl font-black" style="color: var(--accent-color);">CC,</div>
                <div class="text-[10px] font-bold tracking-[0.2em] text-gray-500">CAMPUS CONNECT</div>
            </div>
            <div class="flex items-center space-x-4">
                <button class="text-gray-500 text-xl"><i class="far fa-comment-dots"></i></button>
                <button class="text-gray-500 text-xl"><i class="far fa-bell"></i></button>
            </div>
        </header>
        
        <!-- Tab Navigation -->
        <nav class="flex-shrink-0 flex space-x-8 px-4 border-b border-gray-200">
            <a href="#" class="py-2 text-base font-medium text-gray-500 hover:text-black">추천</a>
            <a href="#" class="py-2 text-base font-medium text-gray-500 hover:text-black">모임</a>
            <a href="#" class="py-2 text-base font-medium text-gray-500 hover:text-black">구해요</a>
            <a href="#" class="py-2 text-base font-bold text-gray-800 border-b-2" style="border-color: var(--accent-color);">장소</a> <!-- '장소' 탭 활성화 -->
        </nav>

        <!-- Main Content -->
        <main class="relative flex-grow flex flex-col overflow-hidden">
            <!-- Filter Section -->
            <div class="px-4 pt-2 pb-3 border-b border-gray-200">
                <!-- Filters Wrapper -->
                <div class="relative flex items-center justify-between">
                    <!-- Default Filters for Places -->
                    <div id="place-filters" class="flex items-center space-x-2">
                        <button data-sort="popular" class="sort-btn px-4 py-1.5 border border-gray-300 rounded-full text-sm text-gray-700 font-bold bg-white">인기순</button>
                        <button data-sort="latest" class="sort-btn px-4 py-1.5 border border-gray-300 rounded-full text-sm text-gray-700">최신순</button>
                        <button data-sort="likes" class="sort-btn px-4 py-1.5 border border-gray-300 rounded-full text-sm text-gray-700">좋아요순</button>
                    </div>

                    <div class="relative">
                        <button id="category-filter-btn" class="px-4 py-1.5 border border-gray-300 rounded-full text-sm text-gray-700 flex items-center">
                            카테고리 <i class="fas fa-chevron-down ml-2 text-xs"></i>
                        </button>
                        <div id="category-dropdown" class="hidden absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-xl z-10 filter-dropdown origin-top-right">
                            <a href="#" class="category-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-category="all">전체</a>
                            <a href="#" class="category-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-category="cafe">카페</a>
                            <a href="#" class="category-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-category="studyroom">스터디룸</a>
                            <a href="#" class="category-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-category="gym">운동시설</a>
                            <a href="#" class="category-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-category="restaurant">식당</a>
                            <a href="#" class="category-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-category="etc">기타</a>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Places List Container -->
            <div id="places-list-container" class="flex-grow overflow-y-auto bg-gray-100 p-4">
                <div id="places-list" class="space-y-3">
                    <!-- Place items will be dynamically inserted here -->
                </div>
            </div>

            <!-- Create Place Floating Action Button -->
            <button class="absolute z-20 bottom-6 right-6 w-14 h-14 rounded-full bg-white flex items-center justify-center text-2xl text-black shadow-lg hover:bg-gray-100 active:scale-95 transition-all border border-gray-200">
                <i class="fas fa-plus"></i>
            </button>
        </main>
        
        <!-- FINAL Bottom Navigation Bar -->
        <footer class="relative flex-shrink-0 h-14">
            <!-- Background SVG -->
            <div class="absolute bottom-0 left-0 w-full h-full z-0">
                <svg class="w-full h-full footer-shadow" viewBox="0 0 375 56" preserveAspectRatio="none" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 15C0 6.71573 6.71573 0 15 0H140C155 0 165 15 175 22C185 29 190 29 200 22C210 15 220 0 235 0H360C368.284 0 375 6.71573 375 15V56H0V15Z"/>
                </svg>
            </div>
            
            <!-- Center Floating Button -->
            <div class="absolute left-1/2 bottom-4 transform -translate-x-1/2 z-20">
                <button class="flex items-center justify-center text-black rounded-full w-16 h-16 shadow-lg shadow-cyan-500/50" style="background-color: var(--accent-color);">
                    <i class="fa-solid fa-tower-broadcast text-2xl"></i>
                </button>
            </div>

            <!-- 5-column navigation grid -->
            <nav class="relative grid grid-cols-5 z-10 h-full">
                <!-- 1. Home -->
                <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-black">
                    <i class="fas fa-home text-2xl"></i>
                </a>
                <!-- 2. Meetings -->
                <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-black">
                    <span class="material-symbols-outlined text-3xl">diversity_3</span>
                </a>
                <!-- 3. Placeholder for center button -->
                <div class="h-full"></div>
                <!-- 4. Places (활성화) -->
                <a href="#" class="flex items-center justify-center h-full text-black">
                    <i class="fa-regular fa-calendar-days text-2xl"></i>
                </a>
                <!-- 5. My Page -->
                <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-black">
                    <i class="fa-solid fa-circle-user text-2xl"></i>
                </a>
            </nav>
        </footer>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Category Dropdown Logic ---
        const categoryBtn = document.getElementById('category-filter-btn');
        const categoryDropdown = document.getElementById('category-dropdown');
        const categoryItems = document.querySelectorAll('.category-item'); // Select all category items

        categoryBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isHidden = categoryDropdown.classList.contains('hidden');
            if (isHidden) {
                categoryDropdown.classList.remove('hidden');
                setTimeout(() => {
                    categoryDropdown.classList.add('opacity-100', 'transform', 'scale-100');
                    categoryDropdown.classList.remove('opacity-0', 'scale-95');
                }, 10);
            } else {
                categoryDropdown.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    categoryDropdown.classList.add('hidden');
                    categoryDropdown.classList.remove('opacity-100', 'scale-100');
                }, 200);
            }
        });

        document.addEventListener('click', (e) => {
            if (!categoryBtn.contains(e.target) && !categoryDropdown.contains(e.target)) {
                categoryDropdown.classList.add('opacity-0', 'scale-95');
                setTimeout(() => {
                    categoryDropdown.classList.add('hidden');
                    categoryDropdown.classList.remove('opacity-100', 'scale-100');
                }, 200);
            }
        });
        
        // --- Place List Logic ---
        const placesListContainer = document.getElementById('places-list-container');
        const placesList = document.getElementById('places-list');
        const sortButtons = document.querySelectorAll('.sort-btn');

        let allPlaces = []; // Store all original places
        let filteredAndSortedPlaces = []; // Stores currently filtered and sorted places
        let currentPage = 0;
        const ITEMS_PER_PAGE = 10;
        let isLoading = false;
        let currentSort = 'popular'; // Default sort
        let currentCategory = 'all'; // Default category filter

        // --- Category mapping for display ---
        const categoryMap = {
            'all': '전체',
            'cafe': '카페',
            'studyroom': '스터디룸',
            'gym': '운동시설',
            'restaurant': '식당',
            'etc': '기타'
        };

        const generateDummyPlaces = (count) => {
            const places = [];
            const names = [
                '캠퍼스 스터디 카페', '아늑한 북카페', '24시 독서실', '체육관 헬스장', 
                '학교 운동장', '학생회관 식당', '도서관 그룹 스터디룸', '중앙 광장'
            ];
            const addresses = [
                '서울시 강남구 역삼동 123-45', '서울시 서초구 서초동 67-89', 
                '경기도 성남시 분당구 정자동 10-20', '부산시 해운대구 우동 30-40',
                '대구시 수성구 범어동 50-60', '인천시 연수구 송도동 70-80',
                '광주시 북구 용봉동 90-100', '대전시 유성구 궁동 110-120'
            ];
            const categories = [
                'cafe', 'cafe', 'studyroom', 'gym', 
                'gym', 'restaurant', 'studyroom', 'etc'
            ];
            const images = [
                'https://images.unsplash.com/photo-1511920170033-0d8a62679f90?q=80&w=2070&auto=format&fit=crop', // Cafe
                'https://images.unsplash.com/photo-1507833513372-55077b426b39?q=80&w=2070&auto=format&fit=crop', // Book Cafe
                'https://images.unsplash.com/photo-1532618793095-bfb395199d06?q=80&w=2070&auto=format&fit=crop', // Study Room
                'https://images.unsplash.com/photo-1571019625470-b6b5860f7e1f?q=80&w=2070&auto=format&fit=crop', // Gym
                'https://images.unsplash.com/photo-1594917951478-f7b5b5b5b5b5?q=80&w=2070&auto=format&fit=crop', // Sports field
                'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=2070&auto=format&fit=crop', // Restaurant
                'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2070&auto=format&fit=crop', // Group Study Room
                'https://images.unsplash.com/photo-1504674900247-087700ff8d74?q=80&w=2070&auto=format&fit=crop' // Plaza
            ];

            for (let i = 0; i < count; i++) {
                const typeIndex = i % names.length;
                places.push({
                    id: `place-${i}`, // Added ID for linking
                    name: names[typeIndex],
                    image: `${images[typeIndex]}&random=${i}`,
                    address: addresses[typeIndex],
                    category: categories[typeIndex],
                    likes: Math.floor(Math.random() * 200) + 10,
                    views: Math.floor(Math.random() * 800) + 100, // Added views
                    comments: Math.floor(Math.random() * 30) + 5, // Added comments
                    isLiked: Math.random() > 0.5
                });
            }
            return places;
        };

        function renderPlaces(placesToRender) {
            placesToRender.forEach(place => {
                const placeEl = document.createElement('div');
                placeEl.className = "relative flex items-start space-x-4 p-3 rounded-lg bg-white shadow-sm";

                placeEl.innerHTML = `
                    <img src="${place.image}" class="w-24 h-24 rounded-lg object-cover" alt="${place.name}" onerror="this.onerror=null;this.src='https://placehold.co/96x96/e5e7eb/6b7280?text=No+Image';">
                    <div class="flex-grow flex flex-col justify-between h-24 py-1">
                        <div>
                            <h3 class="font-bold text-base text-gray-800 mb-1">${place.name}</h3>
                            <p class="text-sm text-gray-500">${place.address}</p>
                        </div>
                        <div class="flex items-center space-x-3 mt-2 text-xs text-gray-500">
                            <span><i class="fas fa-comment-dots mr-1"></i><span class="comments-count">${place.comments}</span></span>
                            <span><i class="fas fa-eye mr-1"></i><span class="views-count">${place.views}</span></span>
                            <span><i class="fas fa-heart text-red-500 mr-1"></i><span class="likes-count">${place.likes}</span></span>
                        </div>
                    </div>
                    <!-- Category badge at bottom right of the card -->
                    <span class="absolute bottom-4 right-3 bg-gray-100 px-2 py-0.5 rounded-full text-xs font-medium text-gray-600">
                        ${categoryMap[place.category] || place.category}
                    </span>
                    <!-- Like button at top right of the card -->
                    <button class="card-like-button absolute top-3 right-3 text-xl ${place.isLiked ? 'text-red-500 fas' : 'text-gray-300 far'}" data-place-id="${place.id}">
                        <i class="${place.isLiked ? 'fas fa-heart' : 'far fa-heart'}"></i>
                    </button>
                `;
                placesList.appendChild(placeEl);
            });

            // Add event listeners for the new like buttons
            document.querySelectorAll('.card-like-button').forEach(likeBtn => {
                likeBtn.addEventListener('click', (e) => {
                    e.stopPropagation(); // Prevent card click event from firing
                    const icon = likeBtn.querySelector('i');
                    const likesCountSpan = likeBtn.closest('.relative').querySelector('.likes-count');
                    let currentLikes = parseInt(likesCountSpan.textContent);

                    if (icon.classList.contains('far')) { // Currently empty heart
                        icon.classList.remove('far', 'text-gray-300');
                        icon.classList.add('fas', 'text-red-500');
                        currentLikes++;
                        console.log(`Place ${likeBtn.dataset.placeId} liked.`);
                    } else { // Currently filled heart
                        icon.classList.remove('fas', 'text-red-500');
                        icon.classList.add('far', 'text-gray-300');
                        currentLikes = Math.max(0, currentLikes - 1); // Prevent negative likes
                        console.log(`Place ${likeBtn.dataset.placeId} unliked.`);
                    }
                    likesCountSpan.textContent = currentLikes; // Update displayed likes count
                });
            });
        }

        // Function to apply filters and sort
        function applyFiltersAndSort() {
            let tempPlaces = [...allPlaces]; // Start with all original data

            // 1. Apply Category Filter
            if (currentCategory !== 'all') {
                tempPlaces = tempPlaces.filter(place => place.category === currentCategory);
            }

            // 2. Apply Sorting
            if (currentSort === 'popular') {
                tempPlaces.sort((a, b) => b.views - a.views); // Sort by views for popularity
            } else if (currentSort === 'latest') {
                tempPlaces.sort((a, b) => {
                    const aIdNum = parseInt(a.id.split('-')[1]);
                    const bIdNum = parseInt(b.id.split('-')[1]);
                    return bIdNum - aIdNum; // Sort by ID descending (simulates latest)
                });
            } else if (currentSort === 'likes') {
                tempPlaces.sort((a, b) => b.likes - a.likes); // Sort by likes
            }
            
            filteredAndSortedPlaces = tempPlaces;
            placesList.innerHTML = ''; // Clear current list
            currentPage = 0; // Reset page for new data
            loadMorePlaces(); // Load first page of filtered/sorted data
        }

        function loadMorePlaces() {
            if (isLoading) return;
            
            isLoading = true;
            const start = currentPage * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const placesToRender = filteredAndSortedPlaces.slice(start, end); // Use filtered and sorted data

            if (placesToRender.length === 0) {
                isLoading = false;
                return; // No more items to load
            }
            
            // Optional: Add a loading spinner here
            setTimeout(() => {
                renderPlaces(placesToRender);
                currentPage++;
                isLoading = false;
                // Optional: Remove loading spinner here
            }, 500); // Simulate network delay
        }

        // Function to update sort button styles
        function updateSortButtonStyles() {
            sortButtons.forEach(btn => {
                if (btn.dataset.sort === currentSort) {
                    btn.classList.add('font-bold', 'bg-white');
                    btn.classList.remove('font-normal');
                } else {
                    btn.classList.remove('font-bold', 'bg-white');
                    btn.classList.add('font-normal');
                }
            });
        }

        // Event Listeners for Sort Buttons
        sortButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                currentSort = e.target.dataset.sort;
                updateSortButtonStyles();
                applyFiltersAndSort();
            });
        });

        // Event Listeners for Category Items
        categoryItems.forEach(item => {
            item.addEventListener('click', (e) => {
                e.preventDefault();
                currentCategory = e.target.dataset.category;
                categoryBtn.innerHTML = `${categoryMap[currentCategory] || currentCategory} <i class="fas fa-chevron-down ml-2 text-xs"></i>`; // Update button text
                categoryDropdown.classList.add('opacity-0', 'scale-95'); // Close dropdown
                setTimeout(() => {
                    categoryDropdown.classList.add('hidden');
                }, 200);
                applyFiltersAndSort();
            });
        });

        // Initial data generation and display
        allPlaces = generateDummyPlaces(30); // Generate more dummy data
        updateSortButtonStyles(); // Set initial button style for 'popular'
        applyFiltersAndSort(); // Initial render with default sort/filter

        // Scroll Event Listener
        placesListContainer.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = placesListContainer;
            // Add a buffer of 5px to trigger loading a bit earlier
            if (scrollTop + clientHeight >= scrollHeight - 5) {
                loadMorePlaces();
            }
        });
    });
</script>

</body>
</html>
