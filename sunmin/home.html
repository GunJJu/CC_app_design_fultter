<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --accent-color: #00FFFF; /* Main neon color */
            --border-color: #E5E7EB;
            --bg-color: #F9FAFB;

            --text-secondary: #6B7280;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }
        /* Custom scrollbar for horizontal lists */
        .horizontal-scroll::-webkit-scrollbar {
            height: 0;
            background: transparent; /* make scrollbar transparent */
        }
        /* Adjust height to account for fixed header and footer */
        .main-content {
             height: calc(100vh - 128px); /* Full screen height minus header(65px) and footer(63px) approx. */
        }
        /* Added for the new footer's shadow effect */
        .footer-shadow {
             filter: drop-shadow(0 -4px 6px rgba(0,0,0,0.05));
        }
    </style>
</head>
