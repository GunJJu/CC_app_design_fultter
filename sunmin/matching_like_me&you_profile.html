<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People I've Liked</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom Tailwind Configuration */
        :root {
            --primary-color: #5E81FF;
            --accent-color: #00ffff;
            --like-color: #FF4F6C;
            --bg-color: #0A0A0A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #00dddd;
        }

        /* SnackBar styling */
        .snackbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
            font-size: 14px;
        }
        .snackbar.show {
            opacity: 1;
        }

        /* For image carousel */
        .scroll-snap-x { scroll-snap-type: x mandatory; }
        .scroll-snap-center { scroll-snap-align: center; }
        /* Prevents user from selecting image while dragging */
        .carousel-dragging img {
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-[#0A0A0A] flex flex-col items-center justify-start min-h-screen">

    <!-- Main App Container -->
    <div id="app-container" class="relative w-full max-w-md h-screen bg-[var(--bg-color)] flex flex-col overflow-hidden">

        <!-- App Bar -->
        <header class="w-full py-4 px-4 flex items-center justify-between absolute top-0 left-0 z-20">
            <button id="back-button" class="text-white/70 text-2xl focus:outline-none">
                <i class="fas fa-arrow-left"></i>
            </button>
            <button id="menu-button" class="text-white/70 text-2xl focus:outline-none">
                <i class="fas fa-bars"></i>
            </button>
        </header>

        <!-- Menu Dropdown -->
        <div id="menu-dropdown" class="hidden absolute top-16 right-4 z-40 bg-gray-900/80 backdrop-blur-sm border border-gray-700 rounded-xl w-48 shadow-lg">
            <div class="p-2">
                <a id="menu-home" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-home w-5 text-center"></i>
                    <span>홈으로</span>
                </a>
                <a id="menu-matching" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-magnifying-glass w-5 text-center"></i>
                    <span>매칭하기</span>
                </a>
                <a id="menu-my-chats" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-comments w-5 text-center"></i>
                    <span>내 채팅</span>
                </a>
                <a id="menu-viewed-me" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-heart w-5 text-center text-like-color"></i>
                    <span>새로운 인연</span>
                </a>
                <a id="menu-i-viewed" href="#" class="flex items-center gap-3 px-4 py-2 text-white/90 rounded-lg hover:bg-gray-700/70 transition-colors">
                    <i class="fas fa-check w-5 text-center"></i>
                    <span>내가 좋아요 한 사람</span>
                </a>
            </div>
        </div>
        
        <!-- Main Content: I Liked List -->
        <main class="flex-grow pt-20 px-4 flex flex-col">
            <h1 class="text-3xl font-bold text-white mb-2">내가 좋아요 한 사람</h1>
            <p class="text-gray-400 mb-6">내가 좋아요한 프로필들이에요.</p>
            
            <div id="user-grid" class="flex-grow overflow-y-auto custom-scroll -mx-2">
                <div class="grid grid-cols-3 gap-2 px-2">
                    <!-- User profile cards will be dynamically inserted here -->
                </div>
            </div>
        </main>

        <!-- Custom SnackBar for messages -->
        <div id="snackbar" class="snackbar"></div>

        <!-- Profile Detail Modal -->
        <div id="profile-modal" class="hidden absolute inset-0 z-30 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 transition-opacity duration-300">
            <div class="relative w-full max-w-sm h-[85vh] bg-gray-900 rounded-2xl flex flex-col overflow-hidden border border-gray-700">
                <button id="close-profile-modal" class="absolute top-3 right-3 z-20 text-white/70 hover:text-white w-8 h-8 bg-black/30 rounded-full">
                    <i class="fas fa-times"></i>
                </button>
                <!-- Image Carousel -->
                <div class="relative flex-shrink-0 aspect-square group">
                    <div id="carousel-images" class="absolute inset-0 flex overflow-x-auto scroll-snap-x custom-scroll cursor-grab active:cursor-grabbing">
                        <!-- Images will be inserted here -->
                    </div>
                    <!-- ADDED: Arrow buttons -->
                    <button id="prev-btn" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-black/30 rounded-full text-white/70 hover:text-white hover:bg-black/50 transition-all opacity-0 group-hover:opacity-100">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <button id="next-btn" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-black/30 rounded-full text-white/70 hover:text-white hover:bg-black/50 transition-all opacity-0 group-hover:opacity-100">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
                <!-- Profile Info -->
                <div id="profile-info" class="flex-grow p-4 overflow-y-auto custom-scroll">
                    <h2 id="profile-name-age" class="text-2xl font-bold text-white"></h2>
                    <div id="profile-tags" class="flex flex-wrap gap-2 my-3"></div>
                    <p id="profile-intro" class="text-gray-300 whitespace-pre-wrap max-h-24 overflow-hidden transition-all duration-500"></p>
                    <button id="read-more-btn" class="text-accent hover:underline">더 보기</button>
                </div>
                <!-- Action Button -->
                <div class="p-4 border-t border-gray-700">
                    <button id="unlike-button" class="w-full py-3 bg-gray-700 text-white rounded-lg hover:bg-gray-600 transition-colors font-bold">좋아요 취소</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const backButton = document.getElementById('back-button');
        const menuButton = document.getElementById('menu-button');
        const menuDropdown = document.getElementById('menu-dropdown');
        const snackbar = document.getElementById('snackbar');
        const userGrid = document.querySelector('#user-grid .grid');
        
        const profileModal = document.getElementById('profile-modal');
        const closeProfileModalButton = document.getElementById('close-profile-modal');
        const carouselImages = document.getElementById('carousel-images');
        const profileNameAge = document.getElementById('profile-name-age');
        const profileTags = document.getElementById('profile-tags');
        const profileIntro = document.getElementById('profile-intro');
        const readMoreBtn = document.getElementById('read-more-btn');
        const unlikeButton = document.getElementById('unlike-button');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');


        // Dummy User Data for "People I've Liked"
        const iLikedUsers = [
            { 
                name: '데이비드', age: 28, 
                photos: [
                    'https://picsum.photos/seed/david_m1/600/600',
                    'https://picsum.photos/seed/david_m2/600/600',
                    'https://picsum.photos/seed/david_m3/600/600'
                ],
                tags: ['운동 좋아해요', '맛집 탐방', '여행', '비흡연'],
                intro: '안녕하세요! 좋은 인연 찾고 싶어요.\n같이 맛있는 거 먹으러 다니는 거 좋아합니다.\n서로에게 좋은 에너지를 줄 수 있는 관계가 되었으면 좋겠어요. 길게 자기소개를 써봤는데 잘 보이나요? 스크롤이 되어야 할텐데요. 길게길게 아주 길게 써보는 중입니다. '
            },
            { 
                name: '사라', age: 25, 
                photos: [
                    'https://picsum.photos/seed/sara_f1/600/600',
                    'https://picsum.photos/seed/sara_f2/600/600',
                    'https://picsum.photos/seed/sara_f3/600/600',
                    'https://picsum.photos/seed/sara_f4/600/600'
                ],
                tags: ['카페', '독서', '영화 감상'],
                intro: '조용한 걸 좋아하는 편이에요. 같이 카페에서 책 읽는 데이트 하고 싶어요.'
            },
            { name: '마이클', age: 29, photos: ['https://picsum.photos/seed/michael_m/600/600'], tags: ['음악', '공연'], intro: '밴드 음악 좋아합니다.' },
            { name: '제시카', age: 26, photos: ['https://picsum.photos/seed/jessica_f1/600/600', 'https://picsum.photos/seed/jessica_f2/600/600'], tags: ['강아지', '산책'], intro: '강아지랑 산책하는게 취미예요!' },
            { name: '크리스', age: 27, photos: ['https://picsum.photos/seed/chris_m/600/600'], tags: ['게임', '넷플릭스'], intro: '집돌이입니다.' },
        ];

        // --- Functions ---

        function showSnackBar(message) {
            snackbar.textContent = message;
            snackbar.classList.add('show');
            setTimeout(() => { snackbar.classList.remove('show'); }, 3000);
        }

        function renderUserGrid() {
            userGrid.innerHTML = ''; // Clear existing grid
            iLikedUsers.forEach((user, index) => {
                const userCard = document.createElement('a');
                userCard.href = '#';
                userCard.className = 'relative aspect-[3/4] rounded-xl overflow-hidden group';
                userCard.onclick = (e) => {
                    e.preventDefault();
                    openProfileModal(user);
                };

                userCard.innerHTML = `
                    <img src="${user.photos[0]}" alt="${user.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>
                    <div class="absolute bottom-2 left-2 text-white">
                        <p class="font-bold text-sm">${user.name}, ${user.age}</p>
                    </div>
                `;
                userGrid.appendChild(userCard);
            });
        }

        function openProfileModal(user) {
            profileNameAge.textContent = `${user.name}, ${user.age}`;
            profileIntro.textContent = user.intro;
            
            profileTags.innerHTML = '';
            user.tags.forEach(tag => {
                const tagEl = document.createElement('span');
                tagEl.className = 'bg-gray-700 text-gray-300 text-xs font-medium px-2.5 py-1 rounded-full';
                tagEl.textContent = tag;
                profileTags.appendChild(tagEl);
            });

            carouselImages.innerHTML = '';
            user.photos.forEach((photoSrc) => {
                const img = document.createElement('img');
                img.src = photoSrc;
                img.className = 'w-full h-full object-cover flex-shrink-0 scroll-snap-center';
                carouselImages.appendChild(img);
            });

            profileIntro.classList.remove('max-h-full');
            profileIntro.classList.add('max-h-24');
            readMoreBtn.textContent = '더 보기';
            if (profileIntro.scrollHeight <= profileIntro.clientHeight) {
                readMoreBtn.classList.add('hidden');
            } else {
                readMoreBtn.classList.remove('hidden');
            }

            profileModal.classList.remove('hidden');
        }

        function closeProfileModal() {
            profileModal.classList.add('hidden');
        }
        
        // --- Carousel Logic ---
        let isDown = false;
        let startX;
        let scrollLeft;

        const startDragging = (e) => {
            isDown = true;
            carouselImages.classList.add('carousel-dragging');
            startX = (e.pageX || e.touches[0].pageX) - carouselImages.offsetLeft;
            scrollLeft = carouselImages.scrollLeft;
        };

        const stopDragging = () => {
            isDown = false;
            carouselImages.classList.remove('carousel-dragging');
            
            const imageWidth = carouselImages.offsetWidth;
            const currentIndex = Math.round(carouselImages.scrollLeft / imageWidth);
            carouselImages.scrollTo({
                left: currentIndex * imageWidth,
                behavior: 'smooth'
            });
        };

        const whileDragging = (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = (e.pageX || e.touches[0].pageX) - carouselImages.offsetLeft;
            const walk = (x - startX) * 2; // The multiplier makes dragging feel more responsive
            carouselImages.scrollLeft = scrollLeft - walk;
        };

        const scrollCarousel = (direction) => {
            const imageWidth = carouselImages.offsetWidth;
            const newScrollLeft = carouselImages.scrollLeft + (direction * imageWidth);
            carouselImages.scrollTo({
                left: newScrollLeft,
                behavior: 'smooth'
            });
        };


        // --- Initial setup on DOMContentLoaded ---
        document.addEventListener('DOMContentLoaded', () => {
            renderUserGrid();

            const iViewedMenuItem = document.getElementById('menu-i-viewed');
            if (iViewedMenuItem) {
                iViewedMenuItem.classList.add('bg-gray-700/70');
            }

            menuButton.addEventListener('click', (e) => {
                e.stopPropagation();
                menuDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!menuDropdown.classList.contains('hidden') && !menuButton.contains(e.target)) {
                    menuDropdown.classList.add('hidden');
                }
            });

            backButton.addEventListener('click', () => {
                showSnackBar('이전 화면으로 돌아갑니다.');
            });

            // Profile modal event listeners
            closeProfileModalButton.addEventListener('click', closeProfileModal);
            
            readMoreBtn.addEventListener('click', () => {
                profileIntro.classList.toggle('max-h-24');
                profileIntro.classList.toggle('max-h-full');
                readMoreBtn.textContent = profileIntro.classList.contains('max-h-full') ? '접기' : '더 보기';
            });
            
            unlikeButton.addEventListener('click', () => {
                showSnackBar('좋아요를 취소했습니다.');
                closeProfileModal();
            });

            // Carousel event listeners
            prevBtn.addEventListener('click', () => scrollCarousel(-1));
            nextBtn.addEventListener('click', () => scrollCarousel(1));
            
            carouselImages.addEventListener('mousedown', startDragging);
            carouselImages.addEventListener('mouseleave', stopDragging);
            carouselImages.addEventListener('mouseup', stopDragging);
            carouselImages.addEventListener('mousemove', whileDragging);

            carouselImages.addEventListener('touchstart', startDragging);
            carouselImages.addEventListener('touchend', stopDragging);
            carouselImages.addEventListener('touchmove', whileDragging);
        });
    </script>
</body>
</html>
