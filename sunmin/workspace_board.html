<!-- 소모임 소개페이지, 게시판 -->

<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소모임 워크스페이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root {
            --accent-color: #FFC300;
            /* Main neon color */
            --deep-green-color: #2E8B57;
            --border-color: #E5E7EB;
            --bg-color: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
        }

        .footer-shadow {
            filter: drop-shadow(0 -4px 6px rgba(0, 0, 0, 0.05));
        }

        .tab-button.active {
            border-bottom: 2px solid var(--accent-color);
            font-weight: bold;
            color: #111827;
            /* text-gray-900 */
        }

        .tab-button:not(.active) {
            color: #6B7280;
            /* text-gray-500 */
        }

        /* Custom scrollbar for content areas */
        .custom-scrollbar::-webkit-scrollbar,
        .horizontal-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-track,
        .horizontal-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb,
        .horizontal-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: transparent;
        }

        #category-filter-highlight {
            position: absolute;
            top: 3px;
            bottom: 3px;
            background-color: var(--deep-green-color);
            /* Updated Color */
            border-radius: 0.375rem;
            /* rounded-md */
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            transition: left 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55), width 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 0;
        }

        .category-filter-button {
            z-index: 1;
        }

        /* Modal styles */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 100;
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            position: relative;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
        }

        /* Refined Search/Category Bar Styles */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.1rem 0.5rem;
            /* Reduced vertical padding */
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            /* rounded-lg */
            margin-bottom: 1rem;
            overflow: hidden;
            min-height: 40px;
            /* Reduced min-height */
            transition: border-color 0.3s ease-in-out;
        }

        .controls-container.search-active,
        .controls-container.category-active {
            border-color: var(--deep-green-color);
            /* Updated Color */
        }

        .control-wrapper {
            display: flex;
            align-items: center;
        }

        .control-icon {
            cursor: pointer;
            padding: 0.375rem;
            /* Reduced padding */
            color: #4b5563;
            /* text-gray-600 */
        }

        .control-icon:hover {
            color: #111827;
            /* text-gray-900 */
        }

        #search-wrapper.active,
        #category-wrapper.active {
            flex-grow: 1;
        }

        #post-search-input-container,
        #category-filter-container {
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: width 0.3s ease-in-out, opacity 0.3s ease-in-out;
            display: flex;
            align-items: center;
        }

        #search-wrapper.active #post-search-input-container,
        #category-wrapper.active #category-filter-container {
            width: 100%;
            opacity: 1;
        }

        #category-filter-wrapper {
            padding: 0.125rem;
            /* p-0.5 */
        }
    </style>
</head>

<body class="bg-white">

    <div class="max-w-md mx-auto h-screen bg-white flex flex-col">

        <!-- Header - Modified for Workspace -->
        <header class="flex-shrink-0 flex items-center justify-between p-4 border-b border-gray-200">
            <!-- Back arrow button -->
            <button class="text-gray-500 text-xl" onclick="history.back()">
                <i class="fas fa-arrow-left"></i>
            </button>
            <!-- Small Group Name - Centered -->
            <h1 class="text-lg font-bold text-gray-800 absolute left-1/2 transform -translate-x-1/2">파이썬 스터디 모임</h1>
            <div class="flex items-center space-x-4">
                <button class="text-gray-500 text-xl"><i class="far fa-comment-dots"></i></button>
                <button class="text-gray-500 text-xl"><i class="far fa-bell"></i></button>
                <!-- Role Selector for Demo -->
                <select id="role-selector" class="text-sm p-1 rounded-md border border-gray-300">
                    <option value="creator">모임리더</option>
                    <option value="sub_manager">운영진</option>
                    <option value="member">멤버</option>
                    <option value="user" selected>사용자</option>
                </select>
            </div>
        </header>

        <!-- Main Content -->
        <main class="relative flex-grow flex flex-col overflow-hidden">
            <!-- Sub-Tab Navigation for Small Group Workspace -->
            <nav class="flex-shrink-0 flex justify-around border-b border-gray-200 bg-white mb-2">
                <button class="tab-button py-2 px-4 text-sm" data-tab="intro">소모임 소개</button>
                <button class="tab-button py-2 px-4 text-sm active" data-tab="board">게시판</button>
                <button class="tab-button py-2 px-4 text-sm" data-tab="free-time">정기모임</button>
                <button class="tab-button py-2 px-4 text-sm" data-tab="gallery">갤러리</button>
                <!-- New tabs for Creator -->
                <button class="tab-button py-2 px-4 text-sm hidden" data-tab="statistics"
                    id="statistics-tab-button">통계</button>
                <button class="tab-button py-2 px-4 text-sm hidden" data-tab="management"
                    id="management-tab-button">관리</button>
            </nav>

            <!-- Tab Content Areas -->
            <div id="tab-content" class="flex-grow overflow-y-auto custom-scrollbar bg-gray-100">
                <!-- 소모임 소개 (Group Intro) Tab -->
                <div id="intro-tab" class="tab-pane hidden bg-white p-4">
                    <!-- Content removed as requested -->
                </div>

                <!-- 게시판 (Bulletin Board) Tab -->
                <div id="board-tab" class="tab-pane active bg-white p-4">
                    <!-- Refined Search and Category Controls -->
                    <div class="controls-container">
                        <div id="category-wrapper" class="control-wrapper">
                            <i id="category-icon" class="fas fa-list-ul control-icon text-lg"></i>
                            <div id="category-filter-container">
                                <div id="category-filter-wrapper"
                                    class="relative flex items-center bg-white rounded-lg w-full">
                                    <div id="category-filter-highlight"></div>
                                    <div class="flex-grow flex items-center overflow-x-auto horizontal-scroll">
                                        <button data-category="all"
                                            class="category-filter-button px-3 py-1 text-sm rounded-md flex-1 text-center whitespace-nowrap">전체</button>
                                        <button data-category="공지"
                                            class="category-filter-button px-3 py-1 text-sm rounded-md flex-1 text-center whitespace-nowrap">공지</button>
                                        <button data-category="모임 후기"
                                            class="category-filter-button px-3 py-1 text-sm rounded-md flex-1 text-center whitespace-nowrap">모임
                                            후기</button>
                                        <button data-category="가입 인사"
                                            class="category-filter-button px-3 py-1 text-sm rounded-md flex-1 text-center whitespace-nowrap">가입
                                            인사</button>
                                        <button data-category="자유"
                                            class="category-filter-button px-3 py-1 text-sm rounded-md flex-1 text-center whitespace-nowrap">자유</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="search-wrapper" class="control-wrapper justify-end">
                            <div id="post-search-input-container">
                                <input type="text" id="post-search-input" placeholder="검색..."
                                    class="w-full p-2 border-0 bg-transparent rounded-md focus:outline-none focus:ring-0">
                            </div>
                            <i id="search-icon" class="fas fa-search control-icon text-lg"></i>
                        </div>
                    </div>

                    <div id="posts-list">
                        <!-- Posts will be dynamically inserted here -->
                    </div>
                </div>

                <!-- 정기모임 (Regular Meeting) Tab -->
                <div id="free-time-tab" class="tab-pane hidden p-4 bg-gray-100">
                    <!-- Content removed as requested -->
                </div>

                <!-- 갤러리 (Gallery) Tab -->
                <div id="gallery-tab" class="tab-pane hidden p-4 bg-gray-100">
                    <!-- Content removed as requested -->
                </div>

                <!-- 통계 (Statistics) Tab (Creator Only) -->
                <div id="statistics-tab" class="tab-pane hidden p-4 bg-gray-100">
                    <!-- Content removed as requested -->
                </div>

                <!-- 관리 (Management) Tab (Creator Only) -->
                <div id="management-tab" class="tab-pane hidden p-4 bg-gray-100">
                    <!-- Content removed as requested -->
                </div>
            </div>

            <!-- Floating Action Button (FAB) for creating content -->
            <button id="fab-create"
                class="absolute z-20 bottom-6 right-6 w-14 h-14 rounded-full bg-white flex items-center justify-center text-2xl text-black shadow-lg hover:bg-gray-100 active:scale-95 transition-all border border-gray-200">
                <i class="fas fa-plus"></i>
            </button>
        </main>

        <!-- FINAL Bottom Navigation Bar -->
        <footer class="relative flex-shrink-0 h-14">
            <!-- Background SVG -->
            <div class="absolute bottom-0 left-0 w-full h-full z-0">
                <svg class="w-full h-full footer-shadow" viewBox="0 0 375 56" preserveAspectRatio="none" fill="white"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M0 15C0 6.71573 6.71573 0 15 0H140C155 0 165 15 175 22C185 29 190 29 200 22C210 15 220 0 235 0H360C368.284 0 375 6.71573 375 15V56H0V15Z" />
                </svg>
            </div>

            <!-- Center Floating Button -->
            <div class="absolute left-1/2 bottom-4 transform -translate-x-1/2 z-20">
                <button
                    class="flex items-center justify-center text-black rounded-full w-16 h-16 shadow-lg shadow-yellow-500/50"
                    style="background-color: var(--accent-color);">
                    <i class="fa-solid fa-tower-broadcast text-2xl"></i>
                </button>
            </div>

            <!-- 5-column navigation grid -->
            <nav class="relative grid grid-cols-5 z-10 h-full">
                <!-- 1. Home -->
                <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-black">
                    <i class="fas fa-home text-2xl"></i>
                </a>
                <!-- 2. Meetings -->
                <a href="#" class="flex items-center justify-center h-full text-black">
                    <!-- This tab is active for this workspace -->
                    <span class="material-symbols-outlined text-3xl">diversity_3</span>
                </a>
                <!-- 3. Placeholder for center button -->
                <div class="h-full"></div>
                <!-- 4. Timetable -->
                <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-black">
                    <i class="fa-regular fa-calendar-days text-2xl"></i>
                </a>
                <!-- 5. My Page -->
                <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-black">
                    <i class="fa-solid fa-circle-user text-2xl"></i>
                </a>
            </nav>
        </footer>
    </div>

    <!-- Modal for New Post/Upload -->
    <div id="create-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-modal-btn">&times;</span>
            <h2 class="text-xl font-bold mb-4" id="modal-title">새 게시물 작성</h2>
            <div class="space-y-4">
                <input type="text" id="post-title" placeholder="제목"
                    class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-500">
                <textarea id="post-content" placeholder="내용"
                    class="w-full p-2 border border-gray-300 rounded-md h-24 resize-none focus:outline-none focus:ring-2 focus:ring-yellow-500"></textarea>
                <input type="file" id="post-image" accept="image/*"
                    class="w-full p-2 border border-gray-300 rounded-md">
                <button id="submit-post-btn"
                    class="w-full text-black py-2 rounded-lg font-semibold hover:opacity-90 transition-colors"
                    style="background-color: var(--accent-color);">작성 완료</button>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const tabButtons = document.querySelectorAll('.tab-button');
            const tabPanes = document.querySelectorAll('.tab-pane');
            const fabCreate = document.getElementById('fab-create');
            const createModal = document.getElementById('create-modal');
            const closeModalBtn = document.getElementById('close-modal-btn');
            const submitPostBtn = document.getElementById('submit-post-btn');
            const postsList = document.getElementById('posts-list');
            const roleSelector = document.getElementById('role-selector');
            const statisticsTabButton = document.getElementById('statistics-tab-button');
            const managementTabButton = document.getElementById('management-tab-button');
            const postSearchInput = document.getElementById('post-search-input');

            // Category Filter elements
            const categoryFilterButtons = document.querySelectorAll('.category-filter-button');
            const categoryFilterHighlight = document.getElementById('category-filter-highlight');

            // New Search/Category control elements
            const controlsContainer = document.querySelector('.controls-container');
            const searchIcon = document.getElementById('search-icon');
            const categoryIcon = document.getElementById('category-icon');
            const searchWrapper = document.getElementById('search-wrapper');
            const categoryWrapper = document.getElementById('category-wrapper');

            // --- Data Storage (Dummy Data) ---
            let currentUserRole = roleSelector.value; // Initialize with default selected role
            let posts = [];
            let currentCategory = 'all';

            // --- Helper Functions ---

            // Update UI based on current user role
            const updateUIForRole = () => {
                // Tab visibility based on role
                if (currentUserRole === 'creator' || currentUserRole === 'sub_manager') {
                    statisticsTabButton.classList.remove('hidden');
                    managementTabButton.classList.remove('hidden');
                } else { // member or user
                    statisticsTabButton.classList.add('hidden');
                    managementTabButton.classList.add('hidden');
                }
                renderPosts(); // Always render posts
            };

            // Generate dummy posts
            const generateDummyPosts = (count) => {
                const dummyTitles = [
                    "이번주 스터디 내용 공지", "다음 모임 시간 투표", "파이썬 프로젝트 아이디어 공유",
                    "새로운 멤버 환영 게시글", "코딩 테스트 문제 풀이", "스터디 자료 공유합니다"
                ];
                const dummyAuthors = ["김코딩", "이파이", "박스터디", "최개발", "현재 사용자"];
                const dummyCategories = ["공지", "자유", "모임 후기", "가입 인사", "자유", "공지"];
                for (let i = 0; i < count; i++) {
                    posts.push({
                        id: Date.now() + i,
                        title: dummyTitles[i % dummyTitles.length],
                        content: `안녕하세요! 이번 주 스터디는 ${dummyTitles[i % dummyTitles.length]} 주제로 진행됩니다. 자세한 내용은 본문을 참고해주세요.`,
                        author: dummyAuthors[i % dummyAuthors.length],
                        date: new Date(Date.now() - Math.random() * 86400000 * 30).toLocaleDateString('ko-KR'), // Within last 30 days
                        comments: Math.floor(Math.random() * 10),
                        likes: Math.floor(Math.random() * 50),
                        views: Math.floor(Math.random() * 100) + 10,
                        category: dummyCategories[i % dummyCategories.length],
                        image: Math.random() > 0.5 ? `https://picsum.photos/seed/${i}/400/300` : null, // Optional image
                        isCurrentUserPost: (dummyAuthors[i % dummyAuthors.length] === "현재 사용자")
                    });
                }
            };

            // Render bulletin board posts
            const renderPosts = () => {
                postsList.innerHTML = '';
                const searchTerm = postSearchInput.value.toLowerCase();

                let filteredPosts = posts;

                // Category filter
                if (currentCategory !== 'all') {
                    filteredPosts = filteredPosts.filter(post => post.category === currentCategory);
                }

                // Search filter
                if (searchTerm) {
                    filteredPosts = filteredPosts.filter(post =>
                        post.title.toLowerCase().includes(searchTerm) ||
                        post.content.toLowerCase().includes(searchTerm) ||
                        post.author.toLowerCase().includes(searchTerm)
                    );
                }

                filteredPosts.sort((a, b) => b.id - a.id); // Sort by latest
                filteredPosts.forEach(post => {
                    const postEl = document.createElement('div');
                    postEl.className = "py-4 border-b border-gray-200";

                    postEl.innerHTML = `
                    <div class="flex items-center justify-between text-xs text-gray-500 mb-2">
                        <div class="flex items-center">
                            <img src="https://placehold.co/24x24/cccccc/666666?text=${post.author.charAt(0)}" class="w-6 h-6 rounded-full mr-2" alt="author profile">
                            <span>${post.author}</span>
                        </div>
                        <span>${post.date}</span>
                    </div>
                    <div class="flex justify-between items-start mt-2">
                        <div class="flex-grow pr-4">
                            <h3 class="text-md font-semibold text-gray-800 mb-1">${post.title}</h3>
                            <p class="text-sm text-gray-600 mb-2">${post.content.substring(0, 80)}...</p>
                        </div>
                        ${post.image ? `<img src="${post.image}" class="w-20 h-20 object-cover rounded-md flex-shrink-0" alt="게시물 썸네일">` : ''}
                    </div>
                    <div class="flex items-center justify-between text-xs text-gray-500 mt-3">
                        <div class="flex space-x-3">
                            <span><i class="far fa-heart mr-1 text-red-500"></i>${post.likes}</span>
                            <span><i class="far fa-comment-dots mr-1 text-blue-500"></i>${post.comments}</span>
                        </div>
                        <span class="bg-gray-100 px-2 py-1 rounded-full text-xs">${post.category}</span>
                    </div>
                `;
                    postsList.appendChild(postEl);
                });
            };

            // --- Event Listeners ---

            // Role Selector Change
            roleSelector.addEventListener('change', (e) => {
                currentUserRole = e.target.value;
                updateUIForRole();
                // Reset to board tab when role changes for clarity
                tabButtons.forEach(btn => btn.classList.remove('active'));
                document.querySelector('.tab-button[data-tab="board"]').classList.add('active');
                tabPanes.forEach(pane => pane.classList.add('hidden'));
                document.getElementById('board-tab').classList.remove('hidden');
                fabCreate.classList.remove('hidden');
            });

            // Tab switching
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');

                    tabPanes.forEach(pane => pane.classList.add('hidden'));
                    const currentTabPane = document.getElementById(`${button.dataset.tab}-tab`);
                    currentTabPane.classList.remove('hidden');

                    // Control FAB visibility based on the active tab
                    if (button.dataset.tab === 'board') {
                        fabCreate.classList.remove('hidden');
                    } else {
                        fabCreate.classList.add('hidden');
                    }

                    if (button.dataset.tab === 'board') {
                        renderPosts();
                    }
                });
            });

            // FAB click to open modal
            fabCreate.addEventListener('click', () => {
                document.getElementById('modal-title').textContent = '새 게시물 작성';
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                document.getElementById('post-image').value = '';
                createModal.style.display = 'flex'; // Show modal
                submitPostBtn.onclick = () => { // Re-assign onclick for new post
                    const title = document.getElementById('post-title').value;
                    const content = document.getElementById('post-content').value;
                    const imageFile = document.getElementById('post-image').files[0];

                    if (title && content) {
                        const newPost = {
                            id: Date.now(),
                            title: title,
                            content: content,
                            author: "현재 사용자", // Placeholder for current user
                            date: new Date().toLocaleDateString('ko-KR'),
                            comments: 0,
                            likes: 0,
                            views: 0,
                            category: "자유",
                            image: imageFile ? URL.createObjectURL(imageFile) : null,
                            isCurrentUserPost: true // New posts are always owned by current user
                        };
                        posts.unshift(newPost); // Add to the beginning
                        renderPosts();
                        createModal.style.display = 'none';
                        // Clear form fields
                        document.getElementById('post-title').value = '';
                        document.getElementById('post-content').value = '';
                        document.getElementById('post-image').value = '';
                    } else {
                        alert('제목과 내용을 입력해주세요.');
                    }
                };
            });

            // Close modal
            closeModalBtn.addEventListener('click', () => {
                createModal.style.display = 'none'; // Hide modal
                // Clear form fields
                document.getElementById('post-title').value = '';
                document.getElementById('post-content').value = '';
                document.getElementById('post-image').value = '';
            });

            // Post Search Input Event Listener
            postSearchInput.addEventListener('input', renderPosts);

            // --- New Search/Category Control Logic ---
            searchIcon.addEventListener('click', () => {
                const isActive = searchWrapper.classList.toggle('active');
                controlsContainer.classList.toggle('search-active', isActive);
                if (isActive) {
                    categoryWrapper.style.display = 'none';
                    searchIcon.className = 'fas fa-times control-icon text-lg';
                    postSearchInput.focus();
                } else {
                    categoryWrapper.style.display = 'flex';
                    searchIcon.className = 'fas fa-search control-icon text-lg';
                }
            });

            categoryIcon.addEventListener('click', () => {
                const isActive = categoryWrapper.classList.toggle('active');
                controlsContainer.classList.toggle('category-active', isActive);
                if (isActive) {
                    searchWrapper.style.display = 'none';
                    categoryIcon.className = 'fas fa-times control-icon text-lg';
                } else {
                    searchWrapper.style.display = 'flex';
                    categoryIcon.className = 'fas fa-list-ul control-icon text-lg';
                }
            });


            // --- Category Filter Logic ---
            function moveCategoryHighlight(target) {
                if (target) {
                    categoryFilterHighlight.style.width = `${target.offsetWidth}px`;
                    categoryFilterHighlight.style.left = `${target.offsetLeft}px`;
                }
            }

            categoryFilterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    moveCategoryHighlight(button);
                    categoryFilterButtons.forEach(btn => {
                        btn.classList.remove('font-semibold', 'text-white');
                        btn.classList.add('font-medium', 'text-gray-600');
                    });
                    button.classList.add('font-semibold', 'text-white');
                    button.classList.remove('font-medium', 'text-gray-600');

                    currentCategory = button.dataset.category;
                    renderPosts();
                });
            });

            // --- Initial Setup ---
            generateDummyPosts(6); // Generate some initial posts
            updateUIForRole(); // Apply initial role-based UI

            // Set initial active tab and FAB
            document.querySelector('.tab-button[data-tab="board"]').click();


            // Set initial category highlight position
            const initialActiveCategory = document.querySelector('.category-filter-button[data-category="all"]');
            if (initialActiveCategory) {
                initialActiveCategory.classList.add('font-semibold', 'text-white');
                initialActiveCategory.classList.remove('font-medium', 'text-gray-600');
                // Use timeout to ensure layout is calculated before moving highlight
                setTimeout(() => moveCategoryHighlight(initialActiveCategory), 50);
            }
        });
    </script>

</body>

</html>
