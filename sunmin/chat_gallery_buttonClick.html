<!-- 매칭화면 내 채팅(갤러리) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom Tailwind Configuration */
        :root {
            --primary-color: #5E81FF;
            --accent-color: #00ffff;
            --like-color: #FF4F6C;
            --bg-color: #0A0A0A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Custom scrollbar */
        .gallery-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .gallery-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .gallery-scroll::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
        }
        .gallery-scroll::-webkit-scrollbar-thumb:hover {
            background: #00dddd;
        }

        /* SnackBar styling */
        .snackbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 1000;
            font-size: 14px;
        }
        .snackbar.show {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-[#0A0A0A] flex flex-col items-center justify-start min-h-screen">

    <!-- Main App Container -->
    <div id="app-container" class="relative w-full max-w-md h-screen bg-[var(--bg-color)] flex flex-col overflow-hidden">

        <!-- App Bar -->
        <header class="w-full py-4 px-4 flex items-center justify-between absolute top-0 left-0 z-20 bg-[var(--bg-color)] border-b border-gray-700/50">
            <div class="w-10"></div> <!-- Placeholder for alignment -->
            <div class="flex items-center">
                <span class="text-white font-bold text-lg">갤러리</span>
            </div>
            <button id="close-button" class="text-white/70 text-2xl focus:outline-none w-10 h-10">
                <i class="fas fa-times"></i>
            </button>
        </header>

        <!-- Main Content: Photo Gallery -->
        <main id="gallery-content" class="flex-grow pt-24 pb-4 px-4 flex flex-col overflow-y-auto gallery-scroll">
            <!-- Gallery items will be dynamically inserted here -->
        </main>

        <!-- Custom SnackBar for messages -->
        <div id="snackbar" class="snackbar"></div>

        <!-- Image Viewer Modal -->
        <div id="image-viewer" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm transition-opacity duration-300">
            <button id="close-viewer-button" class="absolute top-4 right-4 text-white/80 text-3xl z-10 hover:text-white">
                <i class="fas fa-times"></i>
            </button>
            <img id="fullscreen-image" src="" alt="Full-screen view" class="max-w-full max-h-full object-contain">
            <!-- MODIFIED: Changed icon size from text-3xl to text-2xl -->
            <button id="save-image-button" class="absolute bottom-6 right-6 text-white/80 hover:text-white transition-colors">
                <i class="fas fa-download text-2xl drop-shadow-lg"></i>
            </button>
        </div>

    </div>

    <script>
        // DOM Elements
        const closeButton = document.getElementById('close-button');
        const galleryContent = document.getElementById('gallery-content');
        const snackbar = document.getElementById('snackbar');
        const imageViewer = document.getElementById('image-viewer');
        const fullscreenImage = document.getElementById('fullscreen-image');
        const closeViewerButton = document.getElementById('close-viewer-button');
        const saveImageButton = document.getElementById('save-image-button');


        // Dummy Gallery Data
        const galleryData = [
            {
                date: '2025년 7월 22일',
                images: [
                    'https://picsum.photos/seed/gallery1/800/1200',
                    'https://picsum.photos/seed/gallery2/800/1200',
                    'https://picsum.photos/seed/gallery3/800/1200',
                    'https://picsum.photos/seed/gallery4/800/1200',
                ]
            },
            {
                date: '2025년 7월 20일',
                images: [
                    'https://picsum.photos/seed/gallery5/800/1200',
                    'https://picsum.photos/seed/gallery6/800/1200',
                ]
            },
            {
                date: '2025년 7월 19일',
                images: [
                    'https://picsum.photos/seed/gallery7/800/1200',
                    'https://picsum.photos/seed/gallery8/800/1200',
                    'https://picsum.photos/seed/gallery9/800/1200',
                    'https://picsum.photos/seed/gallery10/800/1200',
                    'https://picsum.photos/seed/gallery11/800/1200',
                    'https://picsum.photos/seed/gallery12/800/1200',
                ]
            }
        ];

        // --- Functions ---

        function showSnackBar(message) {
            snackbar.textContent = message;
            snackbar.classList.add('show');
            setTimeout(() => { snackbar.classList.remove('show'); }, 3000);
        }

        function renderGallery() {
            galleryContent.innerHTML = '';
            galleryData.forEach(group => {
                const dateSection = document.createElement('div');
                dateSection.className = 'mb-6';

                const dateHeader = document.createElement('h3');
                dateHeader.className = 'text-gray-400 text-sm font-semibold mb-2';
                dateHeader.textContent = group.date;

                const separator = document.createElement('hr');
                separator.className = 'border-gray-700/50 mb-3';

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-3 gap-1';

                group.images.forEach(imageUrl => {
                    const imageLink = document.createElement('a');
                    imageLink.href = imageUrl; 
                    imageLink.className = 'aspect-square bg-gray-800 rounded-md overflow-hidden';
                    
                    imageLink.onclick = (e) => {
                        e.preventDefault();
                        fullscreenImage.src = imageUrl;
                        imageViewer.classList.remove('hidden');
                    };
                    
                    const image = document.createElement('img');
                    image.src = imageUrl;
                    image.alt = 'Gallery image';
                    image.className = 'w-full h-full object-cover hover:scale-110 transition-transform duration-300';
                    
                    imageLink.appendChild(image);
                    grid.appendChild(imageLink);
                });

                dateSection.appendChild(dateHeader);
                dateSection.appendChild(separator);
                dateSection.appendChild(grid);
                galleryContent.appendChild(dateSection);
            });
        }


        // --- Initial setup on DOMContentLoaded ---
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();

            // Event listener for main close button
            closeButton.addEventListener('click', () => {
                showSnackBar('채팅방으로 돌아갑니다.');
            });

            // Event listeners for the image viewer
            closeViewerButton.addEventListener('click', () => {
                imageViewer.classList.add('hidden');
                fullscreenImage.src = ''; // Clear src to prevent showing old image briefly
            });

            saveImageButton.addEventListener('click', () => {
                showSnackBar('이미지 저장 기능은 준비 중입니다.');
            });
        });
    </script>
</body>
</html>
