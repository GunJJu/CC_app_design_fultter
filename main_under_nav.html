<!-- 하단 메뉴 네비게이션 -->

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하단 네비게이션 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --accent-color: #00FFFF; /* Main neon color */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB; /* Light gray background to see the footer */
        }
        .footer-shadow {
             filter: drop-shadow(0 -4px 6px rgba(0,0,0,0.05));
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- App Container Simulation -->
    <div class="max-w-md mx-auto h-screen bg-gray-100 flex flex-col justify-end">

        <!-- 
            ================================================================
            하단 네비게이션 바 (이 부분만 집중해서 작업합니다)
            ================================================================
        -->
        <footer class="relative flex-shrink-0 h-14">
            <!-- Background SVG -->
            <div class="absolute bottom-0 left-0 w-full h-full z-0">
                <svg class="w-full h-full footer-shadow" viewBox="0 0 375 56" preserveAspectRatio="none" fill="white" xmlns="http://www.w3.org/2000/svg">
                    <!-- MODIFIED: SVG path adjusted for more rounded corners on the notch -->
                    <path d="M0 15C0 6.71573 6.71573 0 15 0H140C155 0 165 15 175 22C185 29 190 29 200 22C210 15 220 0 235 0H360C368.284 0 375 6.71573 375 15V56H0V15Z"/>
                </svg>
            </div>
            
            <!-- Center Floating Button -->
            <div class="absolute left-1/2 bottom-4 transform -translate-x-1/2 z-20">
                 <button class="flex items-center justify-center text-black rounded-full w-16 h-16 shadow-lg shadow-cyan-500/50" style="background-color: var(--accent-color);">
                     <i class="fa-solid fa-tower-broadcast text-2xl"></i>
                </button>
            </div>

             <!-- 5-column navigation grid -->
            <nav class="relative grid grid-cols-5 z-10 h-full">
                 <!-- 1. Home -->
                 <a href="#" class="flex items-center justify-center h-full text-cyan-500">
                    <i class="fas fa-home text-2xl"></i>
                </a>
                <!-- 2. Meetings -->
                 <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-cyan-500">
                    <img src="https://cdn-icons-png.flaticon.com/512/1436/1436701.png" class="w-7 h-7" alt="모임 아이콘">
                </a>
                <!-- 3. Placeholder for center button -->
                <div class="h-full"></div>
                <!-- 4. Timetable -->
                 <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-cyan-500">
                    <i class="fa-regular fa-calendar-days text-2xl"></i>
                </a>
                <!-- 5. My Page -->
                 <a href="#" class="flex items-center justify-center h-full text-gray-400 hover:text-cyan-500">
                     <i class="fas fa-user text-2xl"></i>
                </a>
            </nav>
        </footer>
        <!-- End of Footer -->

    </div>

</body>
</html>
